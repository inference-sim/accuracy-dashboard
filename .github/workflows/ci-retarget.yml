name: CI on retarget

# A retarget (a change of a pull request's base, as when the next pull request of a stack moves to
# main) is an `edited` event, and checks.yml does not run on `edited`. This workflow runs the real
# checks for it: it dispatches checks.yml on the pull request's head branch, so the newest run on the
# head commit is one made after the retarget. An edit of the title or body does nothing here.
#
# A pull request from a fork cannot be dispatched on (the branch is not in this repository, and the
# token is read-only): push a commit, or close and reopen the pull request, to run the checks.
on:
  pull_request:
    types: [edited]

permissions:
  actions: write

jobs:
  dispatch-checks:
    if: ${{ github.event.changes.base && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch checks.yml on the head branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: gh workflow run checks.yml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
