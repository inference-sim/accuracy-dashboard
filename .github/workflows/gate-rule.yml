name: gate-rule

# The rule that every accuracy change lands through the whole-run held-out gate (design VAL-6, Table DC
# "Gate as the path"; docs/m3/gate/README.md). A pull request states, on a line of its own, either
#   Gate: pre-registration <id>
#   Gate: not an accuracy change - <reason>
# and a change to a path in state/gate/accuracy-paths.json must cite a pre-registration that is already on
# the base branch. This job holds no secret and reads no partition. It runs the BASE branch's checker over the
# pull request's tree, so a pull request cannot loosen the rule it is judged by; where the base has no checker
# yet (the change that introduces the rule) it says so and passes.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: gate-rule-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rule:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      # The base checker imports numpy through gate.py. The pinned requirements are the base branch's own, never
      # the pull request's, so a pull request cannot choose the packages its own check runs on.
      - run: pip install --quiet --require-hashes -r requirements-ci.txt
        working-directory: base
      - name: Check the pull request against the rule
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ ! -f base/orchestrator/gate/gate.py ]; then
            echo "The base branch has no gate checker yet; the rule starts with the change that adds it."
            exit 0
          fi
          # The base is the branch's tip now (a re-run sees a later ledger or exception), the head the exact commit
          # of the event, and the change is judged against their merge base, the commit the base run scores.
          merge_base="$(git -C head merge-base "$(git -C base rev-parse HEAD)" "$HEAD_SHA")"
          git -C head worktree add --detach "$RUNNER_TEMP/merge-base" "$merge_base"
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/body.txt"
          git -C head diff --name-status --no-renames "$merge_base" "$HEAD_SHA" > "$RUNNER_TEMP/changes.txt"
          python3 base/orchestrator/gate/gate.py check-pr --body-file "$RUNNER_TEMP/body.txt" \
            --changes-file "$RUNNER_TEMP/changes.txt" --root head --base-root base \
            --pr-number "$PR_NUMBER" --head-sha "$HEAD_SHA" --merge-base "$merge_base" --merge-base-root "$RUNNER_TEMP/merge-base"
