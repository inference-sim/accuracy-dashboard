name: gate-candidate

# One side of a whole-run gate evaluation (docs/m3/gate/README.md). Dispatch it twice: on main (the base) and
# on the branch under test (the candidate), with the same today and label. Each side scores with the simulator
# its own commit pins (SIM_REF in .github/stack-pins.env at the commit dispatched), over the catalog, registry,
# ledger and engine fields that simulator carries, so a change to the pin or to the simulator is evaluated as
# the old build against the new one. Each run scores every ledger unit that is not on the published fit or
# anchor list, so it cannot tell which are held, and keeps the contract, the predictions as a gate Predictions
# document, the measured table, and the simulator commit, data commit and ledger digest it was scored over as
# the artifact `gate-<label>-<sha>`. The gate job re-derives those three from the pin and refuses a mismatch.
#
# The artifact also holds the hash of the scoring files this commit carries (surface.sha256); the gate job
# recomputes it from the commit and refuses a candidate whose scoring files differ from main's.
#
# The workflow holds no secret and no partition. The run's commit is the commit the dispatch ran on
# (github.sha); the gate job reads it back from the Actions API and refuses a Predictions document that names
# another commit. The converter and the unit-list command run from main's checkout, not from the commit under
# test, so only the harness and simulator are the candidate's own.

on:
  workflow_dispatch:
    inputs:
      today:
        description: "the freeze's window end, YYYY-MM-DD (the API rows are read as of this date)"
        required: true
      label:
        description: "names the artifact, [a-z0-9.-]+; the base and the candidate runs of one evaluation share it"
        required: true

permissions:
  contents: read

concurrency:
  group: gate-candidate-${{ inputs.label }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Check the inputs
        env:
          TODAY: ${{ inputs.today }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          [[ "$TODAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "today is not YYYY-MM-DD"; exit 2; }
          [[ "$LABEL" =~ ^[a-z0-9.-]+$ ]] || { echo "label is not [a-z0-9.-]+"; exit 2; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Read the Go release from the pin file
        id: go
        run: grep -E '^GO_VERSION=' repo/harness/harness.pin >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.go.outputs.GO_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --quiet --require-hashes -r requirements-ci.txt
        working-directory: trusted
      - name: Freeze and score
        env:
          GH_TOKEN: ${{ github.token }}
          TODAY: ${{ inputs.today }}
        run: |
          set -euo pipefail
          test "$(git -C repo rev-parse HEAD)" = "$GITHUB_SHA"
          # The simulator this side scores with: the pin at the commit dispatched, resolved to its data by
          # main's resolve_data.sh (the gate job runs the same script over the same pin).
          SIM_REF="$(python3 trusted/orchestrator/gate/gate.py read-sim-pin --pins-file repo/.github/stack-pins.env)"
          bash trusted/orchestrator/gate/resolve_data.sh "$SIM_REF" "$RUNNER_TEMP/data" > "$RUNNER_TEMP/resolved.env"
          set -a; . "$RUNNER_TEMP/resolved.env"; set +a
          LEDGER="$DATA_DIR/catalog/ledger"
          python3 repo/orchestrator/resolve_agentic_corpus.py --catalog "$DATA_DIR/catalog" --all -o "$RUNNER_TEMP/corpora"
          export VLLM_REF
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          python3 trusted/orchestrator/gate/gate.py handed-units --ledger "$LEDGER" --out "$OUT/units.txt"
          python3 repo/orchestrator/baseline/freeze.py --units-file "$OUT/units.txt" --ledger "$LEDGER" \
            --today "$TODAY" --out "$RUNNER_TEMP/pull" --cache "$RUNNER_TEMP/artifacts" --download-workers 4
          bash repo/harness/run.sh --sim "$SIM_REF" --units "$OUT/units.txt" --pull "$RUNNER_TEMP/pull" \
            --out "$OUT/contract" \
            --catalog "$DATA_DIR/catalog" --registry "$DATA_DIR/registry" \
            --corpus-dir "$RUNNER_TEMP/corpora" --fields "$FIELDS" \
            --catalog-release "$DATA_PIN" --registry-release "$DATA_PIN" --max-rss-mb 13000
          python3 trusted/orchestrator/gate/gate.py contract-to-predictions --contract "$OUT/contract" --handed "$OUT/units.txt" \
            --candidate "$GITHUB_SHA" --out "$OUT/predictions.json"
          python3 trusted/orchestrator/gate/gate.py build-measured --contract "$OUT/contract" \
            --ledger "$LEDGER" --modelled-commit "$SIM_COMMIT" --out "$OUT/measured.csv" \
            | tee "$RUNNER_TEMP/measured.txt"
          printf '%s\n' "$DATA_COMMIT" > "$OUT/substrate.txt"
          printf '%s\n' "$SIM_COMMIT" > "$OUT/sim.txt"
          python3 trusted/orchestrator/gate/gate.py ledger-digest --ledger "$LEDGER" > "$OUT/ledger.sha256"
          python3 trusted/orchestrator/gate/gate.py surface-hash --paths-root trusted --root repo > "$OUT/surface.sha256"
          echo "SIM_REF=$SIM_REF" >> "$GITHUB_ENV"
          echo "MEASURED_SHA=$(sha256sum "$OUT/measured.csv" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-${{ inputs.label }}-${{ github.sha }}
          path: ${{ runner.temp }}/out
          retention-days: 90
          if-no-files-found: error
      - name: Record the run
        env:
          LABEL: ${{ inputs.label }}
        run: |
          {
            echo "### ${LABEL}"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- simulator: \`${SIM_REF}\`"
            echo "- measured table sha256 (the pre-registration's measured_sha256 is the one of the base run): \`${MEASURED_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
