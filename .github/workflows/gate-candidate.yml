name: gate-candidate

# One side of a whole-run gate evaluation (docs/m3/gate/README.md). Dispatch it twice: on main (the base) and
# on the branch under test (the candidate), with the same sim, today and label. Each run scores every ledger
# unit that is not on the published fit or anchor list, so it cannot tell which are held, and keeps the contract,
# the predictions as a gate Predictions document, and the measured table as the artifact `gate-<label>-<sha>`.
#
# The workflow holds no secret and no partition. The run's commit is the commit the dispatch ran on
# (github.sha); the gate job reads it back from the Actions API and refuses a Predictions document that names
# another commit. The converter and the unit-list command run from main's checkout, not from the commit under
# test, so only the harness and simulator are the candidate's own.

on:
  workflow_dispatch:
    inputs:
      sim:
        description: "inference-sim release tag (vMAJOR.MINOR.PATCH) or 40-hex commit"
        required: true
      today:
        description: "the freeze's window end, YYYY-MM-DD (the API rows are read as of this date)"
        required: true
      label:
        description: "names the artifact, [a-z0-9.-]+; the base and the candidate runs of one evaluation share it"
        required: true

permissions:
  contents: read

concurrency:
  group: gate-candidate-${{ inputs.label }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Check the inputs
        env:
          SIM_REF: ${{ inputs.sim }}
          TODAY: ${{ inputs.today }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          [[ "$SIM_REF" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?|[0-9a-f]{40})$ ]] || { echo "sim is not a release tag or a 40-hex commit"; exit 2; }
          [[ "$TODAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "today is not YYYY-MM-DD"; exit 2; }
          [[ "$LABEL" =~ ^[a-z0-9.-]+$ ]] || { echo "label is not [a-z0-9.-]+"; exit 2; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: trusted
          persist-credentials: false
      - name: Read the Go release from the pin file
        id: go
        run: grep -E '^GO_VERSION=' repo/harness/harness.pin >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.go.outputs.GO_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --quiet --require-hashes -r requirements-ci.txt
        working-directory: trusted
      - name: Freeze and score
        env:
          GH_TOKEN: ${{ github.token }}
          SIM_REF: ${{ inputs.sim }}
          TODAY: ${{ inputs.today }}
        run: |
          set -euo pipefail
          test "$(git -C repo rev-parse HEAD)" = "$GITHUB_SHA"
          SIM="$RUNNER_TEMP/sim"
          git clone -q --filter=blob:none https://github.com/inference-sim/inference-sim.git "$SIM"
          git -C "$SIM" checkout -q "$SIM_REF"
          eval "$(python3 repo/orchestrator/resolve_stack.py "$SIM")"
          git clone -q --filter=blob:none https://github.com/inference-sim/blis-substrate.git "$RUNNER_TEMP/substrate"
          git -C "$RUNNER_TEMP/substrate" checkout -q "$substrate_ref"
          SUBSTRATE_COMMIT="$(git -C "$RUNNER_TEMP/substrate" rev-parse HEAD)"
          SUBSTRATE_PIN="$SUBSTRATE_COMMIT"
          [[ "$substrate_ref" =~ ^v[0-9] ]] && SUBSTRATE_PIN="$substrate_ref"
          FIELDS="$RUNNER_TEMP/fields.json"
          curl -fsSL --retry 3 -o "$FIELDS" \
            "https://raw.githubusercontent.com/inference-sim/blis-vllm/${vllm_module_ref}/fields.json"
          python3 repo/orchestrator/resolve_agentic_corpus.py --catalog "$RUNNER_TEMP/substrate/catalog" --all -o "$RUNNER_TEMP/corpora"
          export VLLM_REF="$vllm_ref"
          OUT="$RUNNER_TEMP/out"
          mkdir -p "$OUT"
          python3 trusted/orchestrator/gate/gate.py handed-units --ledger "$RUNNER_TEMP/substrate/catalog/ledger" --out "$OUT/units.txt"
          python3 repo/orchestrator/baseline/freeze.py --units-file "$OUT/units.txt" --ledger "$RUNNER_TEMP/substrate/catalog/ledger" \
            --today "$TODAY" --out "$RUNNER_TEMP/pull" --cache "$RUNNER_TEMP/artifacts" --download-workers 4
          bash repo/harness/run.sh --sim "$SIM_REF" --units "$OUT/units.txt" --pull "$RUNNER_TEMP/pull" \
            --out "$OUT/contract" \
            --catalog "$RUNNER_TEMP/substrate/catalog" --registry "$RUNNER_TEMP/substrate/registry" \
            --corpus-dir "$RUNNER_TEMP/corpora" --fields "$FIELDS" \
            --catalog-release "$SUBSTRATE_PIN" --registry-release "$SUBSTRATE_PIN" --max-rss-mb 13000
          SIM_COMMIT="$(git -C "$SIM" rev-parse HEAD)"
          python3 trusted/orchestrator/gate/gate.py contract-to-predictions --contract "$OUT/contract" --handed "$OUT/units.txt" \
            --candidate "$GITHUB_SHA" --out "$OUT/predictions.json"
          python3 trusted/orchestrator/gate/gate.py build-measured --contract "$OUT/contract" \
            --ledger "$RUNNER_TEMP/substrate/catalog/ledger" --modelled-commit "$SIM_COMMIT" --out "$OUT/measured.csv" \
            | tee "$RUNNER_TEMP/measured.txt"
          printf '%s\n' "$SUBSTRATE_COMMIT" > "$OUT/substrate.txt"
          printf '%s\n' "$SIM_COMMIT" > "$OUT/sim.txt"
          echo "MEASURED_SHA=$(sha256sum "$OUT/measured.csv" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-${{ inputs.label }}-${{ github.sha }}
          path: ${{ runner.temp }}/out
          retention-days: 90
          if-no-files-found: error
      - name: Record the run
        env:
          LABEL: ${{ inputs.label }}
          SIM_REF: ${{ inputs.sim }}
        run: |
          {
            echo "### ${LABEL}"
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- simulator: \`${SIM_REF}\`"
            echo "- measured table sha256 (the pre-registration's measured_sha256 is the one of the base run): \`${MEASURED_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
