name: harness-release

# Builds the scoring harness image from a release tag, publishes it to GHCR, signs it by digest
# with cosign keyless signing (the job's GitHub OIDC identity, no key and no secret), and checks
# the signature (design §11.7, X8). A repository that runs the harness pins the digest this job
# prints; the image's tag is a convenience and is never what a pin names.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to build, for example v0.4.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: harness-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/inference-sim/accuracy-dashboard-harness

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Refuse a ref that is not a release tag
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG is not a release tag (vMAJOR.MINOR.PATCH)"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: harness/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.TAG }}
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Sign the image by digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify the signature
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # The certificate names the workflow file at the ref it ran from: the tag on a tag
          # push, main on a dispatch (which then checks out the tag it was given).
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp '^https://github\.com/inference-sim/accuracy-dashboard/\.github/workflows/harness-release\.yml@refs/(tags/v[0-9].*|heads/main)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "${IMAGE}@${DIGEST}" > harness-digest.txt
          {
            echo "### Scoring harness ${TAG}"
            echo
            echo "\`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: harness-digest
          path: harness-digest.txt
          if-no-files-found: error
