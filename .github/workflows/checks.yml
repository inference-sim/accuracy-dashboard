name: checks

# Fast, hosted-only guards: the orchestrator's arithmetic + fail-loud contract, the web unit/render
# tests, and the C1 grep (no third-party baseline name in shipped code). These never need a release
# build — this is the ONLY suite that runs per-PR (the real API-ingest pipeline is api-nightly.yml,
# on a schedule or workflow_dispatch, never on arbitrary PRs).
#
# Triggers scoped so a PR commit runs this exactly ONCE: `pull_request` covers PR branches (incl.
# forks); `push` is limited to the default branch so direct pushes to main are still checked
# without double-firing alongside the PR event.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit supersedes an in-flight run on the same ref — no stacking of fast checks.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  orchestrator:
    runs-on: ubuntu-latest
    steps:
      # Full history: test_contracts_current.py needs the commit each committed contract was scored at.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --quiet --require-hashes -r requirements-ci.txt
      - name: Orchestrator arithmetic + self-consistency oracle + column contract
        run: python3 orchestrator/test_build_summary.py
      - name: Agentic replay arguments read from a row's CI and server logs
        run: python3 orchestrator/test_extract_agentic_replay_args.py
      - name: Single-turn bench settings read from a row's CI log, checked against the harness
        run: python3 orchestrator/test_extract_single_turn_bench_args.py
      - name: Direct corpus shared args-line parser + catalog maps
        run: python3 orchestrator/test_direct_corpus_common.py
      - name: Scenario generator engine settings (relocated gen_scenarios.py)
        run: python3 orchestrator/test_gen_scenarios.py
      - name: Direct corpus carries no baseline-prediction keys (output-neutral drop)
        run: python3 orchestrator/test_gen_direct_corpus.py
      - name: Agentic scoring driver (row -> replay args -> CSV; refusals not scored)
        run: python3 orchestrator/test_run_agentic.py
      - name: Agentic corpus pinned by its catalog workload's revision and full sha256 (X12, D3, COV-12)
        run: python3 -m pytest -q orchestrator/test_resolve_agentic_corpus.py
      - name: Schema validates the committed render fixture (RFC C3)
        run: python3 orchestrator/validate_summary.py --schema schemas/summary.v1.json web/testdata/render-fixture.summary.json
      - name: Contract, fidelity schemas, grades (COV-1, COV-4 to COV-6) and the summary schemas
        run: |
          python3 orchestrator/ingest/test_contract.py
          python3 orchestrator/ingest/contract.py orchestrator/ingest/testdata/contract/run-a orchestrator/ingest/testdata/contract/run-b
      - name: summary.json v3 builder + validator, the committed v3 web fixtures rebuild byte-for-byte, and the frozen v2 ones still validate (COV-8, COV-11)
        run: |
          python3 orchestrator/test_build_summary_v2.py
          python3 orchestrator/build_summary_v2.py --contract orchestrator/ingest/testdata/contract/run-a --out /tmp/v3a.json
          python3 orchestrator/build_summary_v2.py --contract orchestrator/ingest/testdata/contract/run-b --out /tmp/v3b.json --generated-at 2026-10-22T00:00:00Z
          cmp /tmp/v3a.json web/testdata/render-fixture.v3.summary.json
          cmp /tmp/v3b.json web/testdata/render-fixture.v3b.summary.json
          python3 orchestrator/validate_summary_v2.py web/testdata/render-fixture.v3.summary.json web/testdata/render-fixture.v3b.summary.json
          python3 orchestrator/validate_summary_v2.py web/testdata/render-fixture.v2.summary.json web/testdata/render-fixture.v2b.summary.json
      - name: Scoring harness entrypoint flags, harness commit and no image path (design §11.7)
        run: |
          pip install --quiet --require-hashes -r requirements-ci.txt
          python3 -m pytest -q harness/test_run_sh.py
      - name: vLLM build resolution + commit-distance gate (#28; not used by the nightly)
        run: python3 orchestrator/ingest/test_build.py
      - name: API ingest extractor - settings decided by the field list (COV-3), replay inputs, support, artifacts
        run: |
          pip install --quiet --require-hashes -r requirements-ci.txt
          python3 orchestrator/ingest/test_extract.py
          # points through score_point and write_contract, fake BLIS binaries (CI has no BLIS build)
          python3 orchestrator/ingest/test_score_e2e.py
      - name: API nightly pipeline - window, trigger table, no-storage merge, two-retention index, parallel pools, fabricated-release combos (#15)
        run: |
          # These use pytest fixtures (tmp_path, monkeypatch), unlike the older standalone scripts.
          pip install --quiet --require-hashes -r requirements-ci.txt
          python3 -m pytest -q \
            orchestrator/ingest/test_nightly.py \
            orchestrator/ingest/test_incremental.py \
            orchestrator/ingest/test_nightly_run.py \
            orchestrator/ingest/test_cli_nightly.py \
            orchestrator/ingest/test_parallel.py \
            orchestrator/ingest/test_score_pool.py \
            orchestrator/ingest/test_ledger.py \
            orchestrator/ingest/test_inferencex_client.py \
            orchestrator/ingest/test_comparability.py \
            orchestrator/ingest/test_inferencex_runners.py \
            orchestrator/ingest/test_result.py \
            orchestrator/ingest/test_grade.py \
            orchestrator/ingest/test_assess.py \
            orchestrator/ingest/test_engines.py \
            orchestrator/ingest/test_fields.py \
            orchestrator/ingest/test_headline.py \
            orchestrator/ingest/test_backlog.py \
            orchestrator/ingest/test_coverage.py \
            orchestrator/ingest/test_stack.py \
            orchestrator/ingest/test_server_log.py \
            orchestrator/ingest/test_gen_grade_doc.py \
            orchestrator/ingest/test_drafter.py \
            orchestrator/ingest/test_recipe_checkpoints.py \
            orchestrator/ingest/test_locations.py \
            orchestrator/ingest/test_value_refusal.py \
            orchestrator/ingest/test_g1.py \
            orchestrator/ingest/test_pd.py \
            orchestrator/ingest/test_thinking_rule.py \
            orchestrator/baseline/test_compare.py \
            orchestrator/baseline/test_split.py \
            orchestrator/baseline/test_residuals.py \
            orchestrator/baseline/test_docs.py \
            orchestrator/baseline/test_contracts_current.py \
            orchestrator/test_update_index.py
      - name: Every point id of every published snapshot maps to a ledger unit (COV-8)
        run: python3 orchestrator/ingest/legacy_ids.py check --map data/legacy/point-ids.json --data data
      - name: BLIS is read only through the inference-sim commands, except the listed TEMPORARY sites (X7)
        run: |
          python3 -m pytest -q orchestrator/test_lint_blis_boundary.py
          python3 orchestrator/lint_blis_boundary.py

  # The tests that simulate (X16): the primed-warm-up equivalence of the single-turn replay and the
  # request_rows boundary, run through a real `blis replay` built at the pinned commit. They fail,
  # not skip, without a binary, so this job is where they run. The commit is harness/harness.pin's
  # SIM_COMMIT; the Go release is read from that checkout's go.mod.
  simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --quiet --require-hashes -r requirements-ci.txt
      - name: Check out inference-sim at the pinned commit
        run: |
          set -euo pipefail
          sim_commit="$(sed -n 's/^SIM_COMMIT=//p' harness/harness.pin)"
          git init -q "$RUNNER_TEMP/sim"
          git -C "$RUNNER_TEMP/sim" remote add origin https://github.com/inference-sim/inference-sim.git
          git -C "$RUNNER_TEMP/sim" fetch -q --depth 1 origin "$sim_commit"
          git -C "$RUNNER_TEMP/sim" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/sim" rev-parse HEAD)" = "$sim_commit"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: ${{ runner.temp }}/sim/go.mod
          cache-dependency-path: ${{ runner.temp }}/sim/go.sum
      - name: Check out the blis-substrate release the build pins
        run: |
          set -euo pipefail
          tag="$(python3 -c 'import json,sys; print([m["version"] for m in json.load(open(sys.argv[1]))["modules"] if m["path"].endswith("/blis-substrate")][0])' "$RUNNER_TEMP/sim/stack.json")"
          git clone -q --depth 1 --branch "$tag" https://github.com/inference-sim/blis-substrate.git "$RUNNER_TEMP/substrate"
      - name: Check out the blis-substrate commit that defines the point record, with harness_commit and router_differs (blis-substrate layer 12, on origin)
        run: |
          set -euo pipefail
          sha=e3f3c0ee84cf65f8df053b0327773e81bea6803c
          git init -q "$RUNNER_TEMP/substrate-pointrecord"
          git -C "$RUNNER_TEMP/substrate-pointrecord" remote add origin https://github.com/inference-sim/blis-substrate.git
          git -C "$RUNNER_TEMP/substrate-pointrecord" fetch -q --depth 1 origin "$sha"
          git -C "$RUNNER_TEMP/substrate-pointrecord" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/substrate-pointrecord" rev-parse HEAD)" = "$sha"
      - name: Build blis
        run: cd "$RUNNER_TEMP/sim" && GOFLAGS=-mod=mod go build -o blis main.go
      - name: Tests that simulate
        env:
          BLIS_BIN: ${{ runner.temp }}/sim/blis
          BLIS_SUBSTRATE: ${{ runner.temp }}/substrate
          BLIS_SUBSTRATE_LAYER10: ${{ runner.temp }}/substrate-pointrecord
          BLIS_SUBSTRATE_ROUTER_BOUNDS: ${{ runner.temp }}/substrate-pointrecord
        run: python3 -m pytest -q orchestrator/ingest/test_inferencex_client_sim.py orchestrator/ingest/test_score_real_blis.py orchestrator/ingest/test_pointrecord.py orchestrator/ingest/test_pointrecord_pd.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: v2 and v3 browser smoke - real Chromium on each fixture, zero console errors, provenance per point
        run: |
          # Playwright is a locked devDependency (web/package.json, web/package-lock.json),
          # installed by npm ci, so this step installs the browser for the locked version.
          npx playwright install --with-deps chromium
          for v in v2 v3; do
            rm -rf public/data dist
            mkdir -p public/data/latest
            cp testdata/render-fixture.$v.summary.json public/data/latest/summary.json
            node -e "const s=require('./testdata/render-fixture.$v.summary.json');require('fs').writeFileSync('public/data/index.json',JSON.stringify({schema_version:1,latest:s.snapshot_id,keep_api:5,runs:[{snapshot_id:s.snapshot_id,generated_at:s.generated_at,blis_release:s.provenance.blis.release,ix_release:s.provenance.ground_truth.release_tag,ingest:'api',path:'latest/summary.json'}]}))"
            npm run build
            node smoke_v2.mjs
          done
      - name: v1 browser smoke - the nightly's own smoke (browser_smoke.mjs) on the committed v1 snapshot
        run: |
          # The nightly runs browser_smoke.mjs on its fresh snapshot; run it here on the committed
          # one, so a UI change that breaks it fails on the PR, not on the next nightly.
          rm -rf public/data dist
          mkdir -p public/data/latest
          cp ../data/latest/summary.json public/data/latest/summary.json
          npm run build
          node browser_smoke.mjs

  grep-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No AISimulate / AIConfigurator / AIC in shipped code, config or data (RFC C1)
        run: |
          # The RFC + mockup legitimately reference the inspiration as prior art; the DASHBOARD's
          # shipped surface must be clean. Scan authored code/config/data, not the spec docs and
          # not this guard's own pattern (the workflows carry the term only to forbid it).
          hits=$(grep -rniE 'aisimulate|aiconfigurator|\baic\b' \
               --include='*.ts' --include='*.tsx' --include='*.py' --include='*.sh' \
               --include='*.mjs' --include='*.json' --include='*.css' --include='*.html' \
               orchestrator web/src web/browser_smoke.mjs web/smoke_v2.mjs web/package.json web/vite.config.ts \
               schemas state data 2>/dev/null \
             | grep -v -e node_modules -e package-lock || [ "$?" -eq 1 ])
          if [ -n "$hits" ]; then
            echo "::error::forbidden term found in shipped surface (RFC C1)"
            echo "$hits"
            exit 1
          fi
          echo "grep-clean: no forbidden terms in the shipped surface"
