name: checks

# Fast, hosted-only guards: the orchestrator's arithmetic + fail-loud contract, the web unit/render
# tests, the tests that simulate, and the C1 grep (no third-party baseline name in shipped code).
# This is the ONLY suite that runs per-PR (the real API-ingest pipeline is api-nightly.yml, on a
# schedule or workflow_dispatch, never on arbitrary PRs).
#
# Which job runs. `changes` lists the files a pull request changes and .github/ci/which_jobs.py says
# which jobs read them (the lists are in that file; .github/ci/selftest.py pins them). A job whose
# inputs did not change is skipped, and a skipped job counts as passing for the required checks. A push
# to main and a manual run run everything. `gate` is the one check that reads them all: it fails if a
# selected job did not succeed or an unselected job ran.
#
# What a run shows. The Python tests are split into shards (.github/ci/shards.py, the one list of
# which test file runs where; `partition` fails if a test file is in no shard). Inside a shard every
# command runs even when an earlier one fails, and the web steps likewise, so one run shows every
# finding, not the first.
#
# Triggers scoped so a PR commit runs this exactly ONCE: `pull_request` covers PR branches (incl.
# forks); `push` is limited to the default branch so direct pushes to main are still checked
# without double-firing alongside the PR event.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer commit supersedes an in-flight run on the same ref — no stacking of fast checks.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs this run needs, from the files the pull request changes (see the header).
  changes:
    runs-on: ubuntu-latest
    outputs:
      orchestrator: ${{ steps.pick.outputs.orchestrator }}
      simulator: ${{ steps.pick.outputs.simulator }}
      web: ${{ steps.pick.outputs.web }}
      shards: ${{ steps.pick.outputs.shards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: The table of which change runs which job holds its own samples
        run: python3 .github/ci/selftest.py
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "shards=$(python3 .github/ci/shards.py matrix)" >> "$GITHUB_OUTPUT"
          files=""
          if [ "$EVENT" = pull_request ]; then
            files="$(git diff --name-only --no-renames "$BASE...$HEAD")" || { echo "::warning::diff unreadable; running every job"; files=""; }
          fi
          if [ -z "$files" ]; then
            echo "every job runs ($EVENT, or no changed file)"
            python3 .github/ci/which_jobs.py --all | tee -a "$GITHUB_OUTPUT"
          else
            echo "changed files:"; echo "$files" | sed 's/^/  /'
            mapfile -t list <<<"$files"
            python3 .github/ci/which_jobs.py "${list[@]}" | tee -a "$GITHUB_OUTPUT"
          fi

  # Fails when a test file is in no shard (and not in the simulator job or the listed exceptions), or in two.
  partition:
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 .github/ci/shards.py check

  # The Python suite, in parallel shards. Each shard runs every one of its commands and reports all failures.
  shard:
    name: orchestrator-shard (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
    steps:
      # Full history: test_contracts_current.py needs the commit each committed contract was scored at.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            harness/requirements.txt
      - run: pip install --quiet --require-hashes -r requirements-ci.txt
      - run: python3 .github/ci/shards.py run ${{ matrix.shard }}

  # The required check `orchestrator`: passes when the shards and the partition guard passed, or when none was needed.
  orchestrator:
    needs: [changes, partition, shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDED: ${{ needs.changes.outputs.orchestrator }}
          CHANGES: ${{ needs.changes.result }}
          PARTITION: ${{ needs.partition.result }}
          SHARDS: ${{ needs.shard.result }}
        run: |
          if [ "$CHANGES" != success ]; then echo "::error::the change selection did not run ($CHANGES)"; exit 1; fi
          want=skipped; [ "$NEEDED" = true ] && want=success
          echo "orchestrator needed=$NEEDED; partition=$PARTITION shards=$SHARDS (each must be $want)"
          [ "$PARTITION" = "$want" ] && [ "$SHARDS" = "$want" ]

  # The tests that simulate (X16): the primed-warm-up equivalence of the single-turn replay and the
  # request_rows boundary, run through a real `blis replay` built at the pinned commit. They fail,
  # not skip, without a binary, so this job is where they run. The build is .github/stack-pins.env's
  # SIM_REF (a commit or a release tag); the Go release is read from that checkout's go.mod. The built
  # binary is cached by SIM_REF, so the build runs once per pin, not once per run.
  simulator:
    needs: changes
    if: needs.changes.outputs.simulator == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-ci.txt
            harness/requirements.txt
      - run: pip install --quiet --require-hashes -r requirements-ci.txt
      - name: Read the pins
        id: pins
        run: |
          set -euo pipefail
          sim_ref="$(sed -n 's/^SIM_REF=//p' .github/stack-pins.env)"
          echo "sim_ref=$sim_ref" >> "$GITHUB_OUTPUT"
          # A commit or a release tag names fixed content, so its build can be cached; a branch name cannot.
          if echo "$sim_ref" | grep -Eq '^([0-9a-f]{40}|v[0-9]+\.[0-9]+\.[0-9]+)$'; then echo "cacheable=true" >> "$GITHUB_OUTPUT"; fi
      - name: Check out inference-sim at the pinned commit
        run: |
          set -euo pipefail
          sim_ref="${{ steps.pins.outputs.sim_ref }}"
          git init -q "$RUNNER_TEMP/sim"
          git -C "$RUNNER_TEMP/sim" remote add origin https://github.com/inference-sim/inference-sim.git
          git -C "$RUNNER_TEMP/sim" fetch -q --depth 1 origin "$sim_ref"
          git -C "$RUNNER_TEMP/sim" checkout -q FETCH_HEAD
          if echo "$sim_ref" | grep -Eq '^[0-9a-f]{40}$'; then test "$(git -C "$RUNNER_TEMP/sim" rev-parse HEAD)" = "$sim_ref"; fi
      - name: The built binary, by pin
        id: bin
        if: steps.pins.outputs.cacheable == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/blis-bin
          # The "1" is bumped by hand when the build command below changes.
          key: blis-bin-1-${{ runner.os }}-${{ runner.arch }}-${{ steps.pins.outputs.sim_ref }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: steps.bin.outputs.cache-hit != 'true'
        with:
          go-version-file: ${{ runner.temp }}/sim/go.mod
          cache-dependency-path: ${{ runner.temp }}/sim/go.sum
      - name: Build blis
        if: steps.bin.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sim" && GOFLAGS=-mod=mod go build -o blis main.go
          # The tests read stack.json beside the binary, so the cached directory holds both.
          mkdir -p "$RUNNER_TEMP/blis-bin" && cp blis stack.json "$RUNNER_TEMP/blis-bin/"
      - name: Check out the blis-substrate release the build pins
        run: |
          set -euo pipefail
          # stack.json names the substrate by commit, or by release tag when the build pins a release.
          ref="$(python3 -c 'import json,sys; m=[m for m in json.load(open(sys.argv[1]))["modules"] if m["path"].endswith("/blis-substrate")][0]; print(m.get("commit") or m["version"])' "$RUNNER_TEMP/sim/stack.json")"
          git init -q "$RUNNER_TEMP/substrate"
          git -C "$RUNNER_TEMP/substrate" remote add origin https://github.com/inference-sim/blis-substrate.git
          git -C "$RUNNER_TEMP/substrate" fetch -q --depth 1 origin "$ref"
          git -C "$RUNNER_TEMP/substrate" checkout -q FETCH_HEAD
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then test "$(git -C "$RUNNER_TEMP/substrate" rev-parse HEAD)" = "$ref"; fi
      - name: Check out the blis-substrate ref that defines the point record, with harness_commit and router_differs (.github/stack-pins.env)
        run: |
          set -euo pipefail
          # A commit or a release tag (the tag peels to its commit on checkout).
          ref="$(sed -n 's/^SUBSTRATE_REF=//p' .github/stack-pins.env)"
          git init -q "$RUNNER_TEMP/substrate-pointrecord"
          git -C "$RUNNER_TEMP/substrate-pointrecord" remote add origin https://github.com/inference-sim/blis-substrate.git
          git -C "$RUNNER_TEMP/substrate-pointrecord" fetch -q --depth 1 origin "$ref"
          git -C "$RUNNER_TEMP/substrate-pointrecord" checkout -q FETCH_HEAD
          if echo "$ref" | grep -Eq '^[0-9a-f]{40}$'; then test "$(git -C "$RUNNER_TEMP/substrate-pointrecord" rev-parse HEAD)" = "$ref"; fi
      - name: Check out the router fork at the pinned commit (its published endpoint-picker files and index)
        run: |
          set -euo pipefail
          # The router fork's ref that publishes reference-configs/ (.github/stack-pins.env).
          router_sha="$(sed -n 's/^ROUTER_REF=//p' .github/stack-pins.env)"
          if [ -n "$router_sha" ]; then
            git init -q "$RUNNER_TEMP/router"
            git -C "$RUNNER_TEMP/router" remote add origin https://github.com/inference-sim/llm-d-router.git
            git -C "$RUNNER_TEMP/router" fetch -q --depth 1 origin "$router_sha"
            git -C "$RUNNER_TEMP/router" checkout -q FETCH_HEAD
            if echo "$router_sha" | grep -Eq '^[0-9a-f]{40}$'; then test "$(git -C "$RUNNER_TEMP/router" rev-parse HEAD)" = "$router_sha"; fi
            echo "BLIS_ROUTER_CHECKOUT=$RUNNER_TEMP/router" >> "$GITHUB_ENV"
          fi
      - name: Tests that simulate
        env:
          BLIS_BIN: ${{ runner.temp }}/blis-bin/blis
          BLIS_SUBSTRATE: ${{ runner.temp }}/substrate
          BLIS_SUBSTRATE_LAYER10: ${{ runner.temp }}/substrate-pointrecord
          BLIS_SUBSTRATE_ROUTER_BOUNDS: ${{ runner.temp }}/substrate-pointrecord
        run: python3 -m pytest -q $(python3 .github/ci/shards.py simulator-tests)

  # The web steps after `npm ci` each run even when an earlier one failed, so one run shows every failure.
  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - id: deps
        run: npm ci
      - name: Typecheck
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run typecheck
      - name: Unit and render tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run test
      - name: Build
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm run build
      - name: The Chromium build for the locked Playwright
        id: browsers
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: v2 and v3 browser smoke - real Chromium on each fixture, zero console errors, provenance per point
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          # Playwright is a locked devDependency (web/package.json, web/package-lock.json),
          # installed by npm ci, so this step installs the browser for the locked version
          # (a no-op download when the cache above holds it; the system libraries are installed either way).
          npx playwright install --with-deps chromium
          for v in v2 v3; do
            rm -rf public/data dist
            mkdir -p public/data/latest
            cp testdata/render-fixture.$v.summary.json public/data/latest/summary.json
            node -e "const s=require('./testdata/render-fixture.$v.summary.json');require('fs').writeFileSync('public/data/index.json',JSON.stringify({schema_version:1,latest:s.snapshot_id,keep_api:5,runs:[{snapshot_id:s.snapshot_id,generated_at:s.generated_at,blis_release:s.provenance.blis.release,ix_release:s.provenance.ground_truth.release_tag,ingest:'api',path:'latest/summary.json'}]}))"
            npm run build
            node smoke_v2.mjs
          done
      - name: v1 browser smoke - the nightly's own smoke (browser_smoke.mjs) on the committed v1 snapshot
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          # The nightly runs browser_smoke.mjs on its fresh snapshot; run it here on the committed
          # one, so a UI change that breaks it fails on the PR, not on the next nightly.
          rm -rf public/data dist
          mkdir -p public/data/latest
          cp ../data/latest/summary.json public/data/latest/summary.json
          npm run build
          node browser_smoke.mjs

  # Not conditional: it takes seconds and scans paths of every job's inputs.
  grep-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: No AISimulate / AIConfigurator / AIC in shipped code, config or data (RFC C1)
        run: |
          # The RFC + mockup legitimately reference the inspiration as prior art; the DASHBOARD's
          # shipped surface must be clean. Scan authored code/config/data, not the spec docs and
          # not this guard's own pattern (the workflows carry the term only to forbid it).
          hits=$(grep -rniE 'aisimulate|aiconfigurator|\baic\b' \
               --include='*.ts' --include='*.tsx' --include='*.py' --include='*.sh' \
               --include='*.mjs' --include='*.json' --include='*.css' --include='*.html' \
               orchestrator web/src web/browser_smoke.mjs web/smoke_v2.mjs web/package.json web/vite.config.ts \
               schemas state data 2>/dev/null \
             | grep -v -e node_modules -e package-lock || [ "$?" -eq 1 ])
          if [ -n "$hits" ]; then
            echo "::error::forbidden term found in shipped surface (RFC C1)"
            echo "$hits"
            exit 1
          fi
          echo "grep-clean: no forbidden terms in the shipped surface"

  # The one check that reads them all. A selected job must have succeeded and an unselected one must
  # have been skipped; so a job that silently did not run cannot pass. (The required checks today are
  # `orchestrator`, `grep-clean` and `web`; this job is the single check to require instead.)
  gate:
    needs: [changes, partition, orchestrator, simulator, web, grep-clean]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          CHANGES: ${{ needs.changes.result }}
          WANT_ORCH: ${{ needs.changes.outputs.orchestrator }}
          WANT_SIM: ${{ needs.changes.outputs.simulator }}
          WANT_WEB: ${{ needs.changes.outputs.web }}
          R_PARTITION: ${{ needs.partition.result }}
          R_ORCH: ${{ needs.orchestrator.result }}
          R_SIM: ${{ needs.simulator.result }}
          R_WEB: ${{ needs.web.result }}
          R_GREP: ${{ needs.grep-clean.result }}
        run: |
          bad=0
          [ "$CHANGES" = success ] || { echo "::error::the change selection did not run ($CHANGES)"; exit 1; }
          check() { # name wanted result
            want=skipped; [ "$2" = true ] && want=success
            printf '%-14s selected=%-5s result=%s\n' "$1" "$2" "$3"
            [ "$3" = "$want" ] || { echo "::error::$1 is $3, expected $want"; bad=1; }
          }
          check partition "$WANT_ORCH" "$R_PARTITION"
          check simulator "$WANT_SIM" "$R_SIM"
          check web "$WANT_WEB" "$R_WEB"
          check grep-clean true "$R_GREP"
          # `orchestrator` always runs: it reports success when the shards passed or none was needed.
          check orchestrator true "$R_ORCH"
          exit $bad
