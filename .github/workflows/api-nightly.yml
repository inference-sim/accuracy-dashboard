name: api-nightly

# The API-ingest nightly pipeline (Discussion #15, revised 2026-10-25: the no-storage design).
# Replaces the db-dump nightly (nightly.yml): instead of restoring a ~323 GB Postgres dump, it
# pulls the live InferenceX API, scores every anchor unit, with no age limit (COV-2), with the
# resolved BLIS release, and publishes summary v3 `api` snapshots. NOTHING RAW IS PERSISTED -- no ix-store branch, no committed logs;
# the work dir is ephemeral and summary.json IS the score store (an IX-only night merges the delta
# into the published summary). Only the agentic artifact downloads are cached, via actions/cache
# (ephemeral, not committed), to keep a BLIS-release night fast.
#
# Two triggers, detected inside `cli.py nightly` from last night's point-id set in state, never
# here (#15, "Two triggers, two actions"):
#   * an IX data release (a new point id)  -> fetch+score only the new points, merge into the live
#     view; no snapshot/diff;
#   * a BLIS release (a new stable inference-sim tag) -> re-fetch+rescore the whole window, freeze a
#     snapshot, allow a diff. Agentic points whose artifacts expired (>90d) drop to not-scored.
#     Every stable release from v0.16.0 on that state/scored-releases.json does not list is scored
#     once, oldest first (COV-9; resolve_blis.sh). One release is scored and published per run,
#     and the run dispatches itself again while more remain, so a failure in one release leaves
#     the earlier ones published and listed and the next run starts at the one that failed. A
#     release is listed when its scores are published, and the list never shrinks when old
#     snapshots are pruned.
# A no-op night (neither trigger) writes nothing and the last good view stands.
#
# The database-dump lane (plan row 12): the anchor units the frozen dump `db-dump/2026-09-28` supplies are scored in the same
# night, by the same BLIS release and harness commit, from the anchor extract (cached by dump revision + extract sha256, else
# one streaming pass over the pinned parts). The API lane leaves those units alone. The headline publishes only if both lanes
# were scored on one release and one harness commit; if the dump lane fails, nothing publishes and the last good night stands.
# The dump lane's RESULTS (never its data) are kept in state/dump/ and committed with the rest of state/.
on:
  schedule:
    - cron: "43 4 * * *" # nightly, off :00
  workflow_dispatch:
    inputs:
      ignore_cache:
        description: "Ignore the artifact-download cache and re-download everything"
        type: boolean
        default: false
      # A rehearsal: resolve and run-night as always, and publish runs every validation, then prints what it would
      # publish and stops before the commit, the push, the Pages deploy and the next run. The schedule and a normal
      # dispatch publish as before.
      dry_run:
        description: "Validate and print what would be published, and publish nothing"
        type: boolean
        default: false
      # The dump lane reuses its last result when the BLIS release, harness commit, catalog and registry versions and the dump
      # revision are all the same as that result's (orchestrator/ingest/dump_lane.py); this scores it again regardless.
      force_dump:
        description: "Score the database-dump lane again even if its last result is current"
        type: boolean
        default: false
      # A PRE-RELEASE PREVIEW: score this one full inference-sim commit (40 hex) instead of the oldest unscored stable
      # release, from the branch the run is dispatched on. Meant for a scratch branch: the run commits data/ and state/ there
      # and does NOT deploy Pages or start another run, and the build is recorded by its commit, never listed in
      # state/scored-releases.json. Empty (the schedule and every normal dispatch): nothing changes.
      sim_commit:
        description: "Score this inference-sim commit (40 hex) as a pre-release preview; empty scores the stable releases"
        type: string
        default: ""

# Least privilege: read-only by default. Only `publish` gets contents: write.
permissions:
  contents: read

concurrency:
  group: api-nightly
  cancel-in-progress: false

env:
  KEEP_API: "5"

jobs:
  # ----------------------------------------------------------------- 1. resolve BLIS (hosted-safe)
  resolve:
    runs-on: ubuntu-latest
    outputs:
      blis_tag: ${{ steps.r.outputs.blis_tag }}
      blis_tags: ${{ steps.r.outputs.blis_tags }}
      more: ${{ steps.r.outputs.more }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          SIM_COMMIT: ${{ inputs.sim_commit }}
        run: |
          set -euo pipefail
          if [ -n "$SIM_COMMIT" ]; then
            # A preview names its build: no stable tag is resolved, and no other release follows.
            if ! [[ "$SIM_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
              echo "FATAL: sim_commit must be a full 40-hex commit of inference-sim, got '$SIM_COMMIT'"; exit 1
            fi
            { echo "blis_tags=$SIM_COMMIT"; echo "blis_tag=$SIM_COMMIT"; echo "more=false"; } >> "$GITHUB_OUTPUT"
          else
            bash orchestrator/resolve_blis.sh
          fi

  # ----------------------------------------------------------------- 2. run the night (pull+score)
  run-night:
    needs: resolve
    runs-on: ubuntu-latest
    # A BLIS-release night re-fetches the whole window (~4.5 h cold, mostly artifact downloads);
    # parallel downloads + a warm artifact cache bring it well under GitHub's 360-min cap and inside
    # #15's 6 h budget. An IX-only night fetches only the delta and is minutes.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read the Go release from the pin file
        id: pin
        run: grep -E '^GO_VERSION=' harness/harness.pin >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.pin.outputs.GO_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --quiet --require-hashes -r requirements-ci.txt

      # The ONLY thing cached across runs: the agentic artifact-download zips, keyed by artifact id
      # on disk (GitHubArtifacts.download). Ephemeral and NOT committed -- a cold cache just means a
      # slower night, never wrong data. Single-turn needs no artifact (its log is the live API's
      # /server-log), so this holds only the agentic working set, well under the 10 GB cache limit.
      - name: Restore the artifact-download cache
        if: ${{ !inputs.ignore_cache }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/artifacts
          key: ix-artifacts-${{ github.run_id }}
          restore-keys: |
            ix-artifacts-

      # The ledger and the anchor list the dump extract is cut with are the substrate release's of the BLIS release scored: the
      # same files the night reads (cli.py nightly). A hit on the cache does not use them; a miss reads them once.
      - name: Fetch the ledger the dump extract is cut with
        env:
          BLIS_TAGS: ${{ needs.resolve.outputs.blis_tags }}
        run: |
          set -euo pipefail
          BLIS_TAG="${BLIS_TAGS%% *}"
          if [[ "$BLIS_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            # A preview scores a commit: fetch exactly it (a branch or tag name is not used, it moves).
            git init -q "$RUNNER_TEMP/dump-sim"
            git -C "$RUNNER_TEMP/dump-sim" fetch -q --depth 1 https://github.com/inference-sim/inference-sim.git "$BLIS_TAG"
            git -C "$RUNNER_TEMP/dump-sim" checkout -q FETCH_HEAD
          else
            git clone -q --depth 1 --branch "$BLIS_TAG" https://github.com/inference-sim/inference-sim.git "$RUNNER_TEMP/dump-sim"
          fi
          eval "$(python3 orchestrator/resolve_stack.py "$RUNNER_TEMP/dump-sim")"
          if [ "${substrate_embedded:-}" = true ]; then
            # The substrate is a directory of the simulator tree itself (substrate/): the commit pins it.
            mkdir -p "$RUNNER_TEMP/dump-substrate"
            cp -R "$RUNNER_TEMP/dump-sim/substrate/catalog" "$RUNNER_TEMP/dump-substrate/catalog"
          else
            git clone -q --filter=blob:none https://github.com/inference-sim/blis-substrate.git "$RUNNER_TEMP/dump-substrate"
            git -C "$RUNNER_TEMP/dump-substrate" checkout -q "$substrate_ref"
          fi
      - name: The anchor extract of the pinned dump
        uses: ./.github/actions/dump-extract
        with:
          ledger: ${{ runner.temp }}/dump-substrate/catalog/ledger
          anchor: ${{ runner.temp }}/dump-substrate/catalog/ledger/published/anchor.yaml
          out: ${{ runner.temp }}/dump-extract

      # Score the release resolve_blis.sh named: the oldest unscored one, once (COV-9). Build blis
      # FROM SOURCE at the tag (so a per-release score is sound; #15's seed rule), fetch what it
      # pins, and run one night with it. The scoring is harness/run.sh, run from this checkout
      # (design §11.7, X8): it records this checkout's commit on every figure, and refuses to run
      # on a checkout whose harness files differ from that commit. No image is built, pulled or
      # verified. Every point is scored by `blis replay` on requests the harness writes
      # (orchestrator/ingest/score.py); no other scorer is built. A release that
      # fails publishes nothing and leaves the list as it was (COV-8), so the next run scores it
      # again; the releases before it were published by their own runs.
      - name: Score the release
        env:
          BLIS_TAGS: ${{ needs.resolve.outputs.blis_tags }}
          GH_TOKEN: ${{ github.token }}
          DUMP_FORCE: ${{ inputs.force_dump && '--dump-force' || '' }}
        run: |
          set -euo pipefail
          for BLIS_TAG in $BLIS_TAGS; do
            echo "::group::score $BLIS_TAG"
            rm -rf "$RUNNER_TEMP/sim" "$RUNNER_TEMP/substrate" \
              "$RUNNER_TEMP/pull" "$RUNNER_TEMP/contract" "$RUNNER_TEMP/scorework"
            SIM="$RUNNER_TEMP/sim"
            if [[ "$BLIS_TAG" =~ ^[0-9a-f]{40}$ ]]; then
              # A preview scores a commit: fetch exactly it (a branch or tag name is not used, it moves).
              git init -q "$SIM"
              git -C "$SIM" fetch -q --depth 1 https://github.com/inference-sim/inference-sim.git "$BLIS_TAG"
              git -C "$SIM" checkout -q FETCH_HEAD
            else
              git clone -q --depth 1 --branch "$BLIS_TAG" https://github.com/inference-sim/inference-sim.git "$SIM"
            fi
            ( cd "$SIM" && go build -o blis main.go )
            # Everything else the release runs is named by its stack.json (SIM-3, X8), so a new
            # release is scored with no change to this file: the blis-substrate commit (its
            # catalog/, registry/ and catalog/ledger) and the vLLM tag of the engine release.
            eval "$(python3 orchestrator/resolve_stack.py "$SIM")"
            FIELDS="$RUNNER_TEMP/fields.json"
            if [ "${substrate_embedded:-}" = true ]; then
              # A commit whose substrate and engine field list are directories of its own tree: the same checkout.
              SUBSTRATE_DIR="$SIM/substrate"
              cp "$SIM/engines/vllm/fields.json" "$FIELDS"
            else
              git clone -q --filter=blob:none https://github.com/inference-sim/blis-substrate.git "$RUNNER_TEMP/substrate"
              git -C "$RUNNER_TEMP/substrate" checkout -q "$substrate_ref"
              SUBSTRATE_DIR="$RUNNER_TEMP/substrate"
              # The engine's field list: the pinned blis-vllm release's fields.json, at the commit
              # stack.json names. TEMPORARY until the M2 substrate release lets the build print its
              # own list (`blis fields`; inference-sim/accuracy-dashboard#52).
              curl -fsSL --retry 3 -o "$FIELDS" \
                "https://raw.githubusercontent.com/inference-sim/blis-vllm/${vllm_module_ref}/fields.json"
            fi
            CATALOG="$SUBSTRATE_DIR/catalog"
            REGISTRY="$SUBSTRATE_DIR/registry"
            # The ledger at the same commit: every row of the window is placed in one of its
            # units (design §10.2). The units scored are the anchor units in the substrate's
            # published list, catalog/ledger/published/anchor.yaml (cli.py nightly).
            LEDGER="$SUBSTRATE_DIR/catalog/ledger"
            # Every AgentX corpus, at the revision and full sha256 its replay workload in this
            # release's catalog pins (agentx-mvp-uncapped, agentx-mvp; X12, D3). Each point is
            # replayed with the corpus its own run's client loaded (COV-12). Nothing resolves a
            # moving ref such as main. A file kept from an earlier release is reused only if it has
            # the entry's hash.
            python3 orchestrator/resolve_agentic_corpus.py --catalog "$CATALOG" --all -o "$RUNNER_TEMP/corpora"
            # The vLLM tag of the engine release the simulator runs (stack.json engines), so
            # cmd_pull stamps it into the manifest and anchors the build resolver on it.
            export VLLM_REF="$vllm_ref"
            # data/ is the checkout's own main tree, so the dump snapshots and any prior API snapshots
            # (incl. the live view the merge reads) are present; cli.py nightly adds/prunes only API
            # snapshots and never touches a dump one.
            mkdir -p data state
            # No age limit (COV-2): the pull holds every row up to the real UTC date.
            TODAY="$(date -u +%F)"
            # OOM fix (diagnosed by local profiling): a single agentic blis replay's peak RSS is
            # trace-content-driven and unpredictable -- a c64 point used 11.5GB where a c128 used
            # 6.9GB, up to ~14.6GB -- so NO pre-filter (concurrency/model/hw) reliably fits 16GB, and
            # reducing concurrency or the window doesn't help (it's one replay's footprint, not
            # accumulation). The reliable bound is reactive: --max-rss-mb caps each replay's resident
            # memory; one that exceeds ~13GB is killed alone and recorded not_scored:insufficient_memory
            # (counted, visible, no fidelity change -- a larger-RAM run can score it later), while the
            # job survives and scores the rest. Scoring is also split by type: single-turn (light,
            # no corpus) runs --workers-wide, agentic runs --agentic-workers=1. --corpus-cache stays
            # for agentic parse-speed (blis: output identical with or without it).
            # PULL-phase memory is a SEPARATE concern --max-rss-mb does NOT bound: that guard wraps
            # each blis replay subprocess, but the pull holds artifact zips whole in the parent's RAM
            # (download() -> bytes, decompressed in iter_files), one per download worker. On the cold
            # full-rescore a BLIS bump forces (reuse 0 frozen, freeze 2030 fresh), 8 workers all held
            # large agentic blobs from the b300/gb300/mi355x region at once and the 16GB runner was
            # reclaimed mid-pull (run 40709558993: SIGTERM/exit 143 at point ~1759). 4 workers halves
            # that peak; the pull is slower but far inside timeout-minutes. See PR notes.
            python3 orchestrator/ingest/cli.py nightly \
              --blis-tag "$BLIS_TAG" \
              --work-dir "$RUNNER_TEMP/pull" --data-dir data --state state/last-run-api.json \
              --scored state/scored-releases.json \
              --keep-api "$KEEP_API" \
              --today "$TODAY" \
              --workers 4 --agentic-workers 1 --download-workers 4 --max-rss-mb 13000 \
              --cache "$RUNNER_TEMP/artifacts" --corpus-cache "$RUNNER_TEMP/corpus-cache" \
              --work "$RUNNER_TEMP/contract" --score-work "$RUNNER_TEMP/scorework" \
              --evaluator-commit "$GITHUB_SHA" \
              --ledger "$LEDGER" \
              --blis "$SIM/blis" --catalog "$CATALOG" --registry "$REGISTRY" \
              --substrate-dir "$SUBSTRATE_DIR" \
              --substrate-version "$substrate_version" --substrate-commit "$substrate_commit" \
              --corpus-dir "$RUNNER_TEMP/corpora" --fields "$FIELDS" \
              --dump-extract "$RUNNER_TEMP/dump-extract" --dump-state state/dump --dump-workers 2 $DUMP_FORCE
            echo "::endgroup::"
          done

      - name: Build the classes page data from the night's summary and the committed derived files
        run: |
          set -euo pipefail
          # data/supplemental/classes/ holds the derived files of the reconstructed-recipe and configiq classes (committed, with the
          # command and heads that made them); no configiq or reconstructed point is scored here. The night's summary supplies the
          # regular class, so classes.json is always the summary's own snapshot.
          if [ -f data/latest/summary.json ]; then
            python3 orchestrator/build_classes.py build --summary data/latest/summary.json --supplemental data/supplemental/classes --out data/latest/classes.json
          fi
      - name: Build the Sources tab data (funnel.json) from the night's contract and the ledger
        run: |
          set -euo pipefail
          # The funnel (format funnel-2) of what the night scored: every InferenceX unit placed by its grade, G5 reason or fault.
          # Inputs are already on this runner (the ledger fetched above, the contract this night scored), so no secret and no new
          # network access. The API+dump contract is _contract-dump; a night with no dump lane scored into contract itself.
          # When the contract is not the whole of the summary (a merged night) nothing is written and a warning says why: the tab
          # then keeps its "not published" notice. The step never fails the night.
          if [ -f data/latest/summary.json ]; then
            CONTRACT="$RUNNER_TEMP/_contract-dump"
            [ -d "$CONTRACT" ] || CONTRACT="$RUNNER_TEMP/contract"
            python3 orchestrator/nightly/funnel_night.py \
              --ledger "$RUNNER_TEMP/dump-substrate/catalog/ledger" \
              --anchor "$RUNNER_TEMP/dump-substrate/catalog/ledger/published/anchor.yaml" \
              --contract "$CONTRACT" --summary data/latest/summary.json --out data/latest/funnel.json \
              || echo "::warning title=funnel.json not written::funnel_night.py exited $?"
          fi
      - name: Package the published data for the publish job
        run: tar -czf data.tgz -C data . 2>/dev/null || tar -czf data.tgz --files-from /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: night
          path: |
            data.tgz
            state/last-run-api.json
            state/scored-releases.json
            state/dump
          if-no-files-found: warn

  # ----------------------------------------------------------------- 3. publish (hosted-safe)
  publish:
    needs: [resolve, run-night]
    if: ${{ needs.run-night.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit data/ to main
      actions: write # dispatch the Pages deploy (the [skip ci] commit can't)
    steps:
      # Check out with PUBLISH_PAT, a PAT on a human account (susiejojo) with contents:write. The
      # push below must authenticate AS that account: main's ruleset (id 26705484) lists that user
      # as its only bypass actor, and a ruleset User-bypass is matched by the *pusher's* identity
      # (the token type -- classic or fine-grained -- does not matter; only the account does). The
      # default GITHUB_TOKEN can't be used -- it pushes as the GitHub Actions app integration, which
      # this org repo refuses as a bypass actor (422), so its push is rejected "due to repository
      # rule violations" (verified run 42246296162). persist-credentials keeps this token wired into
      # the git remote for the push step.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.PUBLISH_PAT }}
          persist-credentials: true
      # The validation installs requirements-ci.txt, whose hashes are for CPython 3.13's wheels: the runner's own
      # Python moved to 3.14, whose wheels have other hashes, and pip refused the install.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: night
          path: incoming
      # The browser smoke that gates the commit (checks.yml's web job runs the same on a pull request).
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Unpack and validate the incoming data (never swap in a partial artifact)
        run: |
          set -euo pipefail
          mkdir -p newdata
          # A corrupt/truncated artifact must fail here, not be silently half-unpacked and then
          # swapped over data/. If tar fails, the night is lost but data/ on main is untouched.
          tar -xzf incoming/data.tgz -C newdata
          if [ ! -f newdata/index.json ]; then
            echo "no data produced (a no-op night) — nothing to validate or publish"; exit 0
          fi
          # Structural validation before the swap: the two files the dashboard loads must be present
          # and well-formed JSON (catches a truncated upload), and every db-dump snapshot currently
          # on main must survive byte-for-byte in the incoming tree (this pipeline never touches a
          # dump snapshot; its absence or mutation means a bad artifact, so refuse the swap).
          python3 -c "import json,sys; json.load(open('newdata/index.json')); json.load(open('newdata/latest/summary.json'))"
          # COV-7: coverage and the blocker backlog are published every night beside accuracy. A
          # summary without its coverage, or a live view without backlog.json, is refused.
          pip install --quiet --require-hashes -r requirements-ci.txt
          python3 orchestrator/validate_summary_v2.py newdata/latest/summary.json
          python3 - <<'PY'
          import json, sys
          s = json.load(open("newdata/latest/summary.json"))
          try:
              b = json.load(open("newdata/latest/backlog.json"))
          except (OSError, ValueError) as e:
              sys.exit(f"FATAL: data/latest/backlog.json is missing or unreadable ({e}); refusing to publish (COV-7)")
          cov = s.get("coverage") or {}
          missing = [k for k in ("points", "graded", "by_engine", "by_engine_release", "by_chip", "by_grade") if k not in cov]
          if s.get("schema_version") != 3 or missing:
              sys.exit(f"FATAL: the summary publishes no coverage {missing or ''} (schema_version {s.get('schema_version')}); "
                       "refusing to publish (COV-7)")
          if b.get("kind") != "Backlog" or b.get("snapshot_id") != s.get("snapshot_id") or not isinstance(b.get("engines"), dict):
              sys.exit("FATAL: data/latest/backlog.json is not the backlog of the published summary; refusing to publish (COV-7)")
          if s["provenance"].get("experimental") is not False:
              sys.exit("FATAL: the summary is experimental (it used an overlay or an experiment flag, or a "
                       "build or data that is not exactly pinned); it is never published as BLIS's accuracy (design §11.7, X8)")
          PY
          if [ -d data/snapshots ]; then
            for d in data/snapshots/*/; do
              name="$(basename "$d")"
              case "$name" in
                *_ix-api-*) continue ;;  # an API snapshot: this run may legitimately add/prune it
              esac
              if ! diff -rq "$d" "newdata/snapshots/$name" >/dev/null 2>&1; then
                echo "FATAL: dump snapshot $name is missing or changed in the incoming data — refusing to publish"
                exit 1
              fi
            done
          fi

      # KNOWN CEILING (accepted, documented): committing data/ to main grows main's GIT HISTORY,
      # which the last-5 retention does not bound -- those cap the summary's
      # CONTENT and the working-tree snapshot COUNT, not the accumulation of nightly blobs. An
      # IX-only night rewrites latest/summary.json (~6.5 MB) and commits it; git stores a whole new
      # blob each time, so main's .git grows ~6.5 MB per active night, ~2 GB/year, while the
      # checked-out tree stays ~35 MB. Tolerable for years (GitHub's soft guidance is <5 GB); when
      # main approaches that, migrate data/ onto its own squashed branch that Pages deploys from (the
      # cleaner long-term design) -- out of scope here. See PR notes.
      - name: Publish data/ to main (index + latest + API snapshots; dump snapshots untouched)
        id: pub
        env:
          # A scheduled run has no inputs: it is never a dry run.
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
          RELEASE: ${{ needs.resolve.outputs.blis_tags }}
        run: |
          set -euo pipefail
          if [ ! -f newdata/index.json ]; then
            echo "no data produced (a no-op night) — nothing to publish"
            echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          rm -rf data; mv newdata data
          # The state file is this run's trigger-detection input for the NEXT night. Committing data
          # without it would make the next night re-score the same delta (wasted, not wrong), so a
          # missing one is a hard error rather than a silent skip. upload-artifact@v4 preserves each
          # path's directory, so the uploaded `state/last-run-api.json` downloads to
          # incoming/state/last-run-api.json (the `state/` prefix is kept), not incoming/ flat.
          STATE_IN="incoming/state/last-run-api.json"
          if [ ! -f "$STATE_IN" ]; then
            echo "FATAL: run-night produced data but no state file at $STATE_IN — refusing to publish data without its state"
            exit 1
          fi
          # The list of releases with published scores is committed with the rest of state/. It
          # is append-only and independent of the snapshots retained (COV-9), so it comes from
          # the night as it is; a missing one is a hard error for the same reason.
          SCORED_IN="incoming/state/scored-releases.json"
          if [ ! -f "$SCORED_IN" ]; then
            echo "FATAL: run-night produced data but no scored-releases list at $SCORED_IN — refusing to publish"
            exit 1
          fi
          mkdir -p state; cp "$STATE_IN" state/last-run-api.json; cp "$SCORED_IN" state/scored-releases.json
          # The dump lane's last result (its results, never its data): the next night reuses it if nothing it depends on changed.
          if [ -d incoming/state/dump ]; then rm -rf state/dump; cp -R incoming/state/dump state/dump; fi
          # This commit is [skip ci], so nothing checks it after it lands: publish.sh runs the checks it can break
          # (orchestrator/nightly/checks.sh) on this tree before it commits, and a failing check stops the step.
          if [ "$DRY_RUN" = true ]; then
            bash orchestrator/nightly/publish.sh --dry-run unused
            # Every validation above passed; print what would be published, and publish nothing.
            python3 - <<'PY'
          import json, os
          s = json.load(open("data/latest/summary.json"))
          cov = s.get("coverage") or {}
          scored = json.load(open("state/scored-releases.json")).get("releases")
          print("DRY RUN: would publish")
          print(f"  snapshot_id: {s.get('snapshot_id')}")
          print(f"  release: {os.environ['RELEASE']}")
          print(f"  points: {cov.get('points')}, graded: {cov.get('graded')}")
          print(f"  by_grade: {json.dumps(cov.get('by_grade'), sort_keys=True)}")
          print(f"  scored-releases: {scored}")
          PY
            echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rc=0
          bash orchestrator/nightly/publish.sh "api-nightly: ${{ needs.resolve.outputs.blis_tag }} $(date -u +%F) [skip ci]" || rc=$?
          if [ "$rc" = 0 ]; then
            # A long rescore can finish after another commit landed on main; rebase onto it so the
            # push doesn't fail and lose the night. Our commit only touches data/ + state/, which no
            # other workflow writes, so a rebase can't conflict. A few retries absorb a tight race;
            # if all fail the step errors (never report pushed=true for data that didn't land).
            pushed=false
            for attempt in 1 2 3; do
              if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then pushed=true; break; fi
              echo "push rejected (main advanced); retry $attempt"; sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "FATAL: could not push after 3 rebase+retry attempts"; exit 1
            fi
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          elif [ "$rc" = 10 ]; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          else
            echo "FATAL: a check failed or the commit failed (status $rc); nothing was committed or pushed"; exit "$rc"
          fi

      # A preview (sim_commit) is for a scratch branch: its data is not deployed.
      - name: Deploy the published data to Pages
        if: ${{ steps.pub.outputs.pushed == 'true' && inputs.sim_commit == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"

      # More unscored releases remain: this one is published and listed, so start the next run,
      # which begins at the oldest still unlisted. Only after a successful publish, so a failed
      # release is never skipped (COV-9).
      - name: Score the next unscored release
        if: ${{ steps.pub.outputs.pushed == 'true' && needs.resolve.outputs.more == 'true' && inputs.sim_commit == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run api-nightly.yml --ref "${GITHUB_REF_NAME}"
