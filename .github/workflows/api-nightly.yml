name: api-nightly

# The API-ingest nightly pipeline (Discussion #15, revised 2026-10-25: the no-storage design).
# Replaces the db-dump nightly (nightly.yml): instead of restoring a ~323 GB Postgres dump, it
# pulls the live InferenceX API, scores the anchor units of the 180-day window (COV-2) with the
# resolved BLIS release, and publishes summary v3 `api` snapshots. NOTHING RAW IS PERSISTED -- no ix-store branch, no committed logs;
# the work dir is ephemeral and summary.json IS the score store (an IX-only night merges the delta
# into the published summary). Only the agentic artifact downloads are cached, via actions/cache
# (ephemeral, not committed), to keep a BLIS-release night fast.
#
# Two triggers, detected inside `cli.py nightly` from last night's point-id set in state, never
# here (#15, "Two triggers, two actions"):
#   * an IX data release (a new point id)  -> fetch+score only the new points, merge into the live
#     view; no snapshot/diff;
#   * a BLIS release (a new stable inference-sim tag) -> re-fetch+rescore the whole window, freeze a
#     snapshot, allow a diff. Agentic points whose artifacts expired (>90d) drop to not-scored.
#     Every stable release from v0.16.0 on that state/scored-releases.json does not list is scored
#     once, oldest first, one after another in one run (COV-9; resolve_blis.sh). A release is
#     listed when its scores are published, and the list never shrinks when old snapshots are pruned.
# A no-op night (neither trigger) writes nothing and the last good view stands.
on:
  schedule:
    - cron: "43 4 * * *" # nightly, off :00
  workflow_dispatch:
    inputs:
      ignore_cache:
        description: "Ignore the artifact-download cache and re-download everything"
        type: boolean
        default: false

# Least privilege: read-only by default. Only `publish` gets contents: write.
permissions:
  contents: read

concurrency:
  group: api-nightly
  cancel-in-progress: false

env:
  WINDOW_DAYS: "180"
  KEEP_API: "5"

jobs:
  # ----------------------------------------------------------------- 1. resolve BLIS (hosted-safe)
  resolve:
    runs-on: ubuntu-latest
    outputs:
      blis_tag: ${{ steps.r.outputs.blis_tag }}
      blis_tags: ${{ steps.r.outputs.blis_tags }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash orchestrator/resolve_blis.sh

  # ----------------------------------------------------------------- 2. run the night (pull+score)
  run-night:
    needs: resolve
    runs-on: ubuntu-latest
    # A BLIS-release night re-fetches the whole window (~4.5 h cold, mostly artifact downloads);
    # parallel downloads + a warm artifact cache bring it well under GitHub's 360-min cap and inside
    # #15's 6 h budget. An IX-only night fetches only the delta and is minutes.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.27"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --quiet --require-hashes -r requirements-ci.txt

      # The ONLY thing cached across runs: the agentic artifact-download zips, keyed by artifact id
      # on disk (GitHubArtifacts.download). Ephemeral and NOT committed -- a cold cache just means a
      # slower night, never wrong data. Single-turn needs no artifact (its log is the live API's
      # /server-log), so this holds only the agentic working set, well under the 10 GB cache limit.
      - name: Restore the artifact-download cache
        if: ${{ !inputs.ignore_cache }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/artifacts
          key: ix-artifacts-${{ github.run_id }}
          restore-keys: |
            ix-artifacts-

      # The scoring runs in the harness image named by its digest in harness/image.pin (design
      # §11.7, X8), so every figure records the digest of the image that produced it. While the pin
      # says `unpublished` no image exists and this step FAILS: a gate that does not run is a
      # failure (X16), and the scorer is never run from this source tree instead. A digest is
      # verified against the signature harness-release.yml signs with before anything runs it.
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Pin and verify the harness image
        run: |
          set -euo pipefail
          IMAGE_REF="$(python3 orchestrator/ingest/harness_pin.py check harness/image.pin)"
          cosign verify "$IMAGE_REF" \
            --certificate-identity-regexp '^https://github\.com/inference-sim/accuracy-dashboard/\.github/workflows/harness-release\.yml@refs/(tags/v[0-9].*|heads/main)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          docker pull -q "$IMAGE_REF"
          echo "HARNESS_IMAGE=${IMAGE_REF}" >> "$GITHUB_ENV"

      # Score every release resolve_blis.sh named, oldest first, one after another, each once
      # (COV-9). For each: build blis FROM SOURCE at the tag (so a per-release score is sound; #15's
      # seed rule), fetch what it pins, and run one night with it. Every point is scored by
      # `blis replay` on requests the orchestrator writes (orchestrator/ingest/score.py); no other
      # scorer is built. A release that fails stops the run: the releases after it are not scored
      # out of order, and nothing is published (COV-8).
      - name: Score each release, oldest first
        env:
          BLIS_TAGS: ${{ needs.resolve.outputs.blis_tags }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for BLIS_TAG in $BLIS_TAGS; do
            echo "::group::score $BLIS_TAG"
            rm -rf "$RUNNER_TEMP/sim" "$RUNNER_TEMP/substrate" \
              "$RUNNER_TEMP/pull" "$RUNNER_TEMP/contract" "$RUNNER_TEMP/scorework"
            SIM="$RUNNER_TEMP/sim"
            git clone -q --depth 1 --branch "$BLIS_TAG" https://github.com/inference-sim/inference-sim.git "$SIM"
            ( cd "$SIM" && GOFLAGS=-mod=mod go build -o blis main.go )
            # Everything else the release runs is named by its stack.json (SIM-3, X8), so a new
            # release is scored with no change to this file: the blis-substrate commit (its
            # catalog/, registry/ and catalog/ledger) and the vLLM tag of the engine release.
            eval "$(python3 orchestrator/resolve_stack.py "$SIM")"
            git clone -q --filter=blob:none https://github.com/inference-sim/blis-substrate.git "$RUNNER_TEMP/substrate"
            git -C "$RUNNER_TEMP/substrate" checkout -q "$substrate_commit"
            CATALOG="$RUNNER_TEMP/substrate/catalog"
            REGISTRY="$RUNNER_TEMP/substrate/registry"
            # The ledger at the same commit: every row of the window is placed in one of its
            # units (design §10.2). The units scored are the anchor units `blis ledger --list
            # anchor` prints (cli.py nightly). TEMPORARY until an inference-sim command prints
            # the full unit list with identities (catalog/ledger/units) and the ingest report:
            # `blis ledger --list` prints only the published unit ids.
            LEDGER="$RUNNER_TEMP/substrate/catalog/ledger"
            # Every AgentX corpus, at the revision and full sha256 its replay workload in this
            # release's catalog pins (agentx-mvp-uncapped, agentx-mvp; X12, D3). Each point is
            # replayed with the corpus its own run's client loaded (COV-12). Nothing resolves a
            # moving ref such as main. A file kept from an earlier release is reused only if it has
            # the entry's hash.
            python3 orchestrator/resolve_agentic_corpus.py --catalog "$CATALOG" --all -o "$RUNNER_TEMP/corpora"
            # The vLLM tag of the engine release the simulator runs (stack.json engines), so
            # cmd_pull stamps it into the manifest and anchors the build resolver on it.
            export VLLM_REF="$vllm_ref"
            # data/ is the checkout's own main tree, so the dump snapshots and any prior API snapshots
            # (incl. the live view the merge reads) are present; cli.py nightly adds/prunes only API
            # snapshots and never touches a dump one.
            mkdir -p data state
            # Always the full 180-day cumulative window ending the real UTC date -- never shrink it
            # (that would prune the store).
            TODAY="$(date -u +%F)"
            # OOM fix (diagnosed by local profiling): a single agentic blis replay's peak RSS is
            # trace-content-driven and unpredictable -- a c64 point used 11.5GB where a c128 used
            # 6.9GB, up to ~14.6GB -- so NO pre-filter (concurrency/model/hw) reliably fits 16GB, and
            # reducing concurrency or the window doesn't help (it's one replay's footprint, not
            # accumulation). The reliable bound is reactive: --max-rss-mb caps each replay's resident
            # memory; one that exceeds ~13GB is killed alone and recorded not_scored:insufficient_memory
            # (counted, visible, no fidelity change -- a larger-RAM run can score it later), while the
            # job survives and scores the rest. Scoring is also split by type: single-turn (light,
            # no corpus) runs --workers-wide, agentic runs --agentic-workers=1. --corpus-cache stays
            # for agentic parse-speed (blis: output identical with or without it).
            # PULL-phase memory is a SEPARATE concern --max-rss-mb does NOT bound: that guard wraps
            # each blis replay subprocess, but the pull holds artifact zips whole in the parent's RAM
            # (download() -> bytes, decompressed in iter_files), one per download worker. On the cold
            # full-rescore a BLIS bump forces (reuse 0 frozen, freeze 2030 fresh), 8 workers all held
            # large agentic blobs from the b300/gb300/mi355x region at once and the 16GB runner was
            # reclaimed mid-pull (run 40709558993: SIGTERM/exit 143 at point ~1759). 4 workers halves
            # that peak; the pull is slower but far inside timeout-minutes. See PR notes.
            python3 orchestrator/ingest/cli.py nightly \
              --blis-tag "$BLIS_TAG" \
              --work-dir "$RUNNER_TEMP/pull" --data-dir data --state state/last-run-api.json \
              --scored state/scored-releases.json \
              --window-days "$WINDOW_DAYS" --keep-api "$KEEP_API" \
              --today "$TODAY" \
              --workers 4 --agentic-workers 1 --download-workers 4 --max-rss-mb 13000 \
              --cache "$RUNNER_TEMP/artifacts" --corpus-cache "$RUNNER_TEMP/corpus-cache" \
              --work "$RUNNER_TEMP/contract" --score-work "$RUNNER_TEMP/scorework" \
              --evaluator-commit "$GITHUB_SHA" \
              --ledger "$LEDGER" \
              --blis "$SIM/blis" --catalog "$CATALOG" --registry "$REGISTRY" \
              --harness-image "$HARNESS_IMAGE" \
              --corpus-dir "$RUNNER_TEMP/corpora"
            echo "::endgroup::"
          done

      - name: Package the published data for the publish job
        run: tar -czf data.tgz -C data . 2>/dev/null || tar -czf data.tgz --files-from /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: night
          path: |
            data.tgz
            state/last-run-api.json
            state/scored-releases.json
          if-no-files-found: warn

  # ----------------------------------------------------------------- 3. publish (hosted-safe)
  publish:
    needs: [resolve, run-night]
    if: ${{ needs.run-night.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # commit data/ to main
      actions: write # dispatch the Pages deploy (the [skip ci] commit can't)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: night
          path: incoming
      - name: Unpack and validate the incoming data (never swap in a partial artifact)
        run: |
          set -euo pipefail
          mkdir -p newdata
          # A corrupt/truncated artifact must fail here, not be silently half-unpacked and then
          # swapped over data/. If tar fails, the night is lost but data/ on main is untouched.
          tar -xzf incoming/data.tgz -C newdata
          if [ ! -f newdata/index.json ]; then
            echo "no data produced (a no-op night) — nothing to validate or publish"; exit 0
          fi
          # Structural validation before the swap: the two files the dashboard loads must be present
          # and well-formed JSON (catches a truncated upload), and every db-dump snapshot currently
          # on main must survive byte-for-byte in the incoming tree (this pipeline never touches a
          # dump snapshot; its absence or mutation means a bad artifact, so refuse the swap).
          python3 -c "import json,sys; json.load(open('newdata/index.json')); json.load(open('newdata/latest/summary.json'))"
          # COV-7: coverage and the blocker backlog are published every night beside accuracy. A
          # summary without its coverage, or a live view without backlog.json, is refused.
          pip install --quiet --require-hashes -r requirements-ci.txt
          python3 orchestrator/validate_summary_v2.py newdata/latest/summary.json
          python3 - <<'PY'
          import json, sys
          s = json.load(open("newdata/latest/summary.json"))
          try:
              b = json.load(open("newdata/latest/backlog.json"))
          except (OSError, ValueError) as e:
              sys.exit(f"FATAL: data/latest/backlog.json is missing or unreadable ({e}); refusing to publish (COV-7)")
          cov = s.get("coverage") or {}
          missing = [k for k in ("points", "graded", "by_engine", "by_engine_release", "by_chip", "by_grade") if k not in cov]
          if s.get("schema_version") != 3 or missing:
              sys.exit(f"FATAL: the summary publishes no coverage {missing or ''} (schema_version {s.get('schema_version')}); "
                       "refusing to publish (COV-7)")
          if b.get("kind") != "Backlog" or b.get("snapshot_id") != s.get("snapshot_id") or not isinstance(b.get("engines"), dict):
              sys.exit("FATAL: data/latest/backlog.json is not the backlog of the published summary; refusing to publish (COV-7)")
          if s["provenance"].get("experimental") is not False:
              sys.exit("FATAL: the summary is experimental (its simulator build is not a release); it is never "
                       "published as BLIS's accuracy (design §11.7, X8)")
          PY
          if [ -d data/snapshots ]; then
            for d in data/snapshots/*/; do
              name="$(basename "$d")"
              case "$name" in
                *_ix-api-*) continue ;;  # an API snapshot: this run may legitimately add/prune it
              esac
              if ! diff -rq "$d" "newdata/snapshots/$name" >/dev/null 2>&1; then
                echo "FATAL: dump snapshot $name is missing or changed in the incoming data — refusing to publish"
                exit 1
              fi
            done
          fi

      # KNOWN CEILING (accepted, documented): committing data/ to main grows main's GIT HISTORY,
      # which neither the 180-day window nor the last-5 retention bounds -- those cap the summary's
      # CONTENT and the working-tree snapshot COUNT, not the accumulation of nightly blobs. An
      # IX-only night rewrites latest/summary.json (~6.5 MB) and commits it; git stores a whole new
      # blob each time, so main's .git grows ~6.5 MB per active night, ~2 GB/year, while the
      # checked-out tree stays ~35 MB. Tolerable for years (GitHub's soft guidance is <5 GB); when
      # main approaches that, migrate data/ onto its own squashed branch that Pages deploys from (the
      # cleaner long-term design) -- out of scope here. See PR notes.
      - name: Publish data/ to main (index + latest + API snapshots; dump snapshots untouched)
        id: pub
        run: |
          set -euo pipefail
          if [ ! -f newdata/index.json ]; then
            echo "no data produced (a no-op night) — nothing to publish"
            echo "pushed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          rm -rf data; mv newdata data
          # The state file is this run's trigger-detection input for the NEXT night. Committing data
          # without it would make the next night re-score the same delta (wasted, not wrong), so a
          # missing one is a hard error rather than a silent skip. upload-artifact@v4 preserves each
          # path's directory, so the uploaded `state/last-run-api.json` downloads to
          # incoming/state/last-run-api.json (the `state/` prefix is kept), not incoming/ flat.
          STATE_IN="incoming/state/last-run-api.json"
          if [ ! -f "$STATE_IN" ]; then
            echo "FATAL: run-night produced data but no state file at $STATE_IN — refusing to publish data without its state"
            exit 1
          fi
          # The list of releases with published scores is committed with the rest of state/. It
          # is append-only and independent of the snapshots retained (COV-9), so it comes from
          # the night as it is; a missing one is a hard error for the same reason.
          SCORED_IN="incoming/state/scored-releases.json"
          if [ ! -f "$SCORED_IN" ]; then
            echo "FATAL: run-night produced data but no scored-releases list at $SCORED_IN — refusing to publish"
            exit 1
          fi
          mkdir -p state; cp "$STATE_IN" state/last-run-api.json; cp "$SCORED_IN" state/scored-releases.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data state/last-run-api.json state/scored-releases.json
          if git commit -m "api-nightly: ${{ needs.resolve.outputs.blis_tag }} $(date -u +%F) [skip ci]"; then
            # A long rescore can finish after another commit landed on main; rebase onto it so the
            # push doesn't fail and lose the night. Our commit only touches data/ + state/, which no
            # other workflow writes, so a rebase can't conflict. A few retries absorb a tight race;
            # if all fail the step errors (never report pushed=true for data that didn't land).
            pushed=false
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
              if git push; then pushed=true; break; fi
              echo "push rejected (main advanced); retry $attempt"; sleep 5
            done
            if [ "$pushed" != true ]; then
              echo "FATAL: could not push after 3 rebase+retry attempts"; exit 1
            fi
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing to commit (index unchanged)"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the published data to Pages
        if: ${{ steps.pub.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
