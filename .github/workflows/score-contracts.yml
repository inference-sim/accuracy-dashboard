name: score-contracts

# Scores a current contract (design §11.7, X8). Every committed contract that is not a historical record
# (docs/m2/historical-contracts.json) comes from a run of this workflow, so a scorer change can always be
# answered by scoring it again here: the M3 baseline and every later re-score.
#
# One run does the whole path on the runner, and nothing is taken from a developer's machine:
#   1. checks out the harness commit asked for (run.sh records the checkout's HEAD as the harness commit);
#   2. reads the simulator's stack.json for the blis-substrate commit (catalog, registry, ledger), the blis-vllm
#      fields.json and the vLLM tag, as the nightly does;
#   3. freezes the units from the live InferenceX API and its Actions artifacts, on this run's own token;
#   4. scores them with harness/run.sh, and writes the splits file beside the contract;
#   5. keeps the frozen pull and the contract as artifacts. The pull is third-party data (X12): it is an
#      artifact of this run, never committed and never a release asset. The contract's
#      provenance.json records the pull's manifest sha256, and the run's summary prints it with the
#      artifact's name, so the contract names the exact pull it was scored from.
#
# The contract directory is then committed by hand from the `contract` artifact, beside the work that asked
# for it; test_contracts_current.py holds it to the scorer at HEAD from then on.

on:
  workflow_dispatch:
    inputs:
      harness_commit:
        description: "accuracy-dashboard commit to score with (40 hex)"
        required: true
      sim:
        description: "inference-sim release tag (vMAJOR.MINOR.PATCH) or 40-hex commit"
        required: true
      units:
        description: "units file at the harness commit, one ledger unit per line (repository path)"
        required: true
      today:
        description: "the freeze's window end, YYYY-MM-DD (the API rows are read as of this date)"
        required: true
      label:
        description: "the contract's name, [a-z0-9.-]+ (names the artifacts)"
        required: true

permissions:
  contents: read

concurrency:
  group: score-contracts-${{ inputs.label }}
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - name: Check the inputs
        env:
          HARNESS_COMMIT: ${{ inputs.harness_commit }}
          SIM_REF: ${{ inputs.sim }}
          UNITS: ${{ inputs.units }}
          TODAY: ${{ inputs.today }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          [[ "$HARNESS_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "harness_commit is not a full 40-hex commit"; exit 2; }
          [[ "$SIM_REF" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?|[0-9a-f]{40})$ ]] || { echo "sim is not a release tag or a 40-hex commit"; exit 2; }
          [[ "$UNITS" =~ ^[A-Za-z0-9._/-]+$ && "$UNITS" != /* && "$UNITS" != *..* ]] || { echo "units is not a repository path"; exit 2; }
          [[ "$TODAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "today is not YYYY-MM-DD"; exit 2; }
          [[ "$LABEL" =~ ^[a-z0-9.-]+$ ]] || { echo "label is not [a-z0-9.-]+"; exit 2; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.harness_commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Read the Go release from the pin file
        id: go
        run: grep -E '^GO_VERSION=' harness/harness.pin >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.go.outputs.GO_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --quiet --require-hashes -r requirements-ci.txt
      - name: Freeze and score
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_COMMIT: ${{ inputs.harness_commit }}
          SIM_REF: ${{ inputs.sim }}
          UNITS: ${{ inputs.units }}
          TODAY: ${{ inputs.today }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HARNESS_COMMIT"
          test -f "$UNITS" || { echo "no units file $UNITS at the harness commit"; exit 2; }
          SIM="$RUNNER_TEMP/sim"
          git clone -q --filter=blob:none https://github.com/inference-sim/inference-sim.git "$SIM"
          git -C "$SIM" checkout -q "$SIM_REF"
          eval "$(python3 orchestrator/resolve_stack.py "$SIM")"
          git clone -q --filter=blob:none https://github.com/inference-sim/blis-substrate.git "$RUNNER_TEMP/substrate"
          git -C "$RUNNER_TEMP/substrate" checkout -q "$substrate_ref"
          SUBSTRATE_PIN="$(git -C "$RUNNER_TEMP/substrate" rev-parse HEAD)"
          [[ "$substrate_ref" =~ ^v[0-9] ]] && SUBSTRATE_PIN="$substrate_ref"
          FIELDS="$RUNNER_TEMP/fields.json"
          curl -fsSL --retry 3 -o "$FIELDS" \
            "https://raw.githubusercontent.com/inference-sim/blis-vllm/${vllm_module_ref}/fields.json"
          python3 orchestrator/resolve_agentic_corpus.py --catalog "$RUNNER_TEMP/substrate/catalog" --all -o "$RUNNER_TEMP/corpora"
          export VLLM_REF="$vllm_ref"
          mkdir -p "$RUNNER_TEMP/out"
          python3 orchestrator/baseline/freeze.py --units-file "$UNITS" --ledger "$RUNNER_TEMP/substrate/catalog/ledger" \
            --today "$TODAY" --out "$RUNNER_TEMP/out/pull" --cache "$RUNNER_TEMP/artifacts" --download-workers 4
          bash harness/run.sh --sim "$SIM_REF" --units "$UNITS" --pull "$RUNNER_TEMP/out/pull" \
            --out "$RUNNER_TEMP/out/contract/contract" \
            --catalog "$RUNNER_TEMP/substrate/catalog" --registry "$RUNNER_TEMP/substrate/registry" \
            --corpus-dir "$RUNNER_TEMP/corpora" --fields "$FIELDS" \
            --catalog-release "$SUBSTRATE_PIN" --registry-release "$SUBSTRATE_PIN" --max-rss-mb 13000
          python3 orchestrator/baseline/split.py splits --pull "$RUNNER_TEMP/out/pull" --out "$RUNNER_TEMP/out/contract/splits.json"
          cp "$UNITS" "$RUNNER_TEMP/out/contract/units.txt"
          # The contract names the pull it was scored from: the manifest's sha256 must be the provenance's.
          got="$(sha256sum "$RUNNER_TEMP/out/pull/manifest.json" | cut -d' ' -f1)"
          want="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["pull_manifest_sha256"])' "$RUNNER_TEMP/out/contract/contract/provenance.json")"
          test "$got" = "$want" || { echo "the pull's manifest sha256 $got is not the contract's $want"; exit 1; }
          echo "PULL_SHA=$got" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        id: pull
        with:
          name: pull-${{ inputs.label }}-${{ env.PULL_SHA }}
          path: ${{ runner.temp }}/out/pull
          # The longest GitHub keeps an artifact of a public repository. A contract older than this is re-scored
          # from a fresh run of this workflow, or listed as historical with its reason.
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-${{ inputs.label }}
          path: ${{ runner.temp }}/out/contract
          retention-days: 90
          if-no-files-found: error
      - name: Record the pull
        env:
          LABEL: ${{ inputs.label }}
          HARNESS_COMMIT: ${{ inputs.harness_commit }}
          SIM_REF: ${{ inputs.sim }}
          PULL_ID: ${{ steps.pull.outputs.artifact-id }}
        run: |
          {
            echo "### ${LABEL}"
            echo "- harness commit: \`${HARNESS_COMMIT}\`"
            echo "- simulator: \`${SIM_REF}\`"
            echo "- pull manifest sha256: \`${PULL_SHA}\`"
            echo "- pull artifact: \`pull-${LABEL}-${PULL_SHA}\` (id ${PULL_ID}, run ${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"
