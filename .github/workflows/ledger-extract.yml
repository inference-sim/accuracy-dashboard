name: ledger-extract

# Builds the ledger extract: the rows (and the vLLM logs) of the InferenceX dump the ledger's units were drawn from,
# in one compact file the nightly and its rehearsals read instead of the 34 GB dump (design 2.2, COV-1;
# orchestrator/ingest/ledger_extract.py, docs/nightly.md).
#
# Run it by hand once per ledger revision (a blis-substrate release whose catalog/ledger/sources.yaml pins another
# dump or other supplements), on main, so the cache it saves is readable by every branch. It:
#   1. checks out blis-substrate at the ref given, for sources.yaml, export.sql and the unit list;
#   2. restores the four tables the extract reads from the pinned dump into a scratch PostgreSQL 17 cluster, each
#      part checked against the SHA-256 sources.yaml states;
#   3. fetches the pinned supplements with the substrate's own `ledger supplement-records` (refused if any differs
#      from its pin);
#   4. writes the extract, checks that its rows place exactly the ledger's units, and prints the pin to commit as
#      .github/ledger-extract.json;
#   5. saves the extract to the Actions cache under its sha256, and keeps it as a 90-day artifact.
#
# Redistribution (X12): sources.yaml records the InferenceX data's licence as NOASSERTION, so the extract is never
# committed, never a release asset, and never published: it lives only in this repository's Actions cache and
# artifacts. The same dump and scripts give the same bytes, so a lost cache entry is rebuilt by running this again.

on:
  workflow_dispatch:
    inputs:
      substrate_ref:
        description: "blis-substrate release tag whose ledger the extract is for"
        required: true

permissions:
  contents: read

concurrency:
  group: ledger-extract-${{ inputs.substrate_ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check the input
        env:
          REF: ${{ inputs.substrate_ref }}
        run: |
          [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "substrate_ref is not a release tag"; exit 2; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Read the Go release from the pin file
        id: pin
        run: grep -E '^GO_VERSION=' harness/harness.pin >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.pin.outputs.GO_VERSION }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - run: pip install --quiet --require-hashes -r requirements-ci.txt
      - name: Build the extract
        env:
          REF: ${{ inputs.substrate_ref }}
        run: |
          set -euo pipefail
          # The runner's preinstalled toolchains this job does not use; the restore needs the disk.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP" | tail -1
          SUB="$RUNNER_TEMP/substrate"
          git clone -q --filter=blob:none https://github.com/inference-sim/blis-substrate.git "$SUB"
          git -C "$SUB" checkout -q "$REF"
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-17 zstd >/dev/null
          bash orchestrator/ingest/build_ledger_extract.sh "$SUB" "$RUNNER_TEMP/extract"
          SHA=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$RUNNER_TEMP/extract/ledger-extract.json")
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          {
            echo "### Ledger extract for blis-substrate ${REF}"
            echo '```json'
            cat "$RUNNER_TEMP/extract/ledger-extract.json"
            echo '```'
            echo "Commit this as .github/ledger-extract.json."
          } >> "$GITHUB_STEP_SUMMARY"
      # The key is the extract's sha256, known only now: the cache misses here and keeps the file when the job ends.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/extract/ledger-extract.jsonl.gz
          key: ledger-extract-${{ env.SHA }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ledger-extract-${{ env.SHA }}
          path: ${{ runner.temp }}/extract
          retention-days: 90
          if-no-files-found: error
