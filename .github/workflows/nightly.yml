name: nightly-accuracy (legacy db-dump, manual only)

# The legacy db-dump pipeline (RFC §4.6). SUPERSEDED by api-nightly.yml (Discussion #15): the
# nightly schedule moved off the ~323 GB Postgres dump and onto the live InferenceX API. This
# workflow is kept — the dump is not yet confirmed discontinued (#15 open question 4), and its
# three committed snapshots stay viewable — but it no longer runs on a schedule. Its `publish` job
# only ever touched db-dump snapshots and state/last-run.json, so it can't disturb the API side.
# Run it on demand only if a new dump lands and someone wants it scored.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Re-evaluate even if inputs are unchanged"
        type: boolean
        default: false

# Least privilege (PR #3 review point 4): read-only by default so `evaluate` — which builds and
# runs CLONED UPSTREAM code — cannot push. Only the `publish` job is granted `contents: write`.
permissions:
  contents: read

concurrency:
  group: nightly-accuracy
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------- 1. detect-diff (hosted-safe)
  detect-diff:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      blis_tag: ${{ steps.resolve.outputs.blis_tag }}
      ix_tag: ${{ steps.resolve.outputs.ix_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve both inputs live (never hardcoded)
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash orchestrator/resolve_inputs.sh
      - name: Diff against state/last-run.json
        id: diff
        env:
          BLIS_TAG: ${{ steps.resolve.outputs.blis_tag }}
          IX_TAG: ${{ steps.resolve.outputs.ix_tag }}
        run: bash orchestrator/detect_diff.sh

  # ---------------------------------------------------------------- 2. evaluate (full real dump)
  evaluate:
    needs: detect-diff
    if: ${{ needs.detect-diff.outputs.changed == 'true' || inputs.force }}
    # Runs the full real dump on a GitHub-hosted runner: the ingest streams the ~31 GB compressed
    # dump straight through zstd into pg_restore of only the 3 tables the extractor reads, so
    # neither the compressed nor the ~323 GB decompressed archive lands on disk — only ~6 GB of
    # restored tables sit in the Postgres service container. No self-hosted runner needed.
    runs-on: ubuntu-latest
    # The ~25-min restore + the signedprobe blis-replay tail (a few high-concurrency replays
    # dominate wall-time) can run long on a 2-core hosted runner; raise above GitHub's 360-min
    # default so the real run is never cut mid-score.
    timeout-minutes: 480
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: inferencex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install deps (jsonschema, psql 17, zstd)
        run: |
          pip install --quiet jsonschema
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17 zstd

      - name: Evaluate — stream dump → build from source → signedprobe → summary.json
        env:
          BLIS_TAG: ${{ needs.detect-diff.outputs.blis_tag }}
          IX_TAG: ${{ needs.detect-diff.outputs.ix_tag }}
          GH_TOKEN: ${{ github.token }}
          DASH_DIR: ${{ github.workspace }}
          WORK: ${{ github.workspace }}/.work
        run: |
          export SNAPSHOT_DATE="$(date -u +%Y-%m-%d)"
          bash orchestrator/evaluate.sh

      - name: Stage the fresh snapshot for the site + tests
        run: |
          snap_id=$(python3 -c "import json;print(json.load(open('.work/summary.json'))['snapshot_id'])")
          mkdir -p web/public/data/latest "web/public/data/snapshots/${snap_id}" data/latest
          cp .work/summary.json web/public/data/latest/summary.json
          cp .work/summary.json "web/public/data/snapshots/${snap_id}/summary.json"
          cp .work/summary.json data/latest/summary.json
          # The dev-server smoke needs a real index.json (production always has one).
          python3 orchestrator/update_index.py --data-dir web/public/data --retention-days 30 --today "$(date -u +%F)"

      - name: Headless render smoke-test (zero console errors, real data — RFC B1)
        working-directory: web
        run: |
          npm ci
          npm run test        # renderToStaticMarkup: zero console errors + no NaN/blank on the real snapshot
          npm run build       # tsc + vite build; dist/ bundles the data for Pages

      - name: Browser smoke-test (real Chromium, zero console errors — RFC B1)
        working-directory: web
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
          node browser_smoke.mjs
          # DEV server too — unminified React surfaces warnings (duplicate keys, etc.) the
          # production build strips.
          npm run dev > /tmp/dev.log 2>&1 &
          DEV_PID=$!
          for i in $(seq 1 30); do grep -q "Local:" /tmp/dev.log && break; sleep 1; done
          SMOKE_URL=http://localhost:5173 node browser_smoke.mjs
          kill $DEV_PID 2>/dev/null || true

      - name: Upload snapshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: summary-json
          path: .work/summary.json

  # ---------------------------------------------------------------- 3. publish (hosted-safe)
  publish:
    needs: [detect-diff, evaluate]
    if: ${{ needs.evaluate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # ONLY this job may commit the snapshot to the Pages-served branch
      actions: write # dispatch the Pages deploy after publishing (the [skip ci] commit can't)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: summary-json
          path: incoming

      - name: Diff — unchanged input ⇒ no-op (RFC D3)
        id: changecheck
        run: |
          new="incoming/summary.json"
          cur="data/latest/summary.json"
          if [ -f "$cur" ] && python3 -c "
          import json,sys
          a=json.load(open('$new')); b=json.load(open('$cur'))
          sys.exit(0 if a.get('snapshot_id')==b.get('snapshot_id') and a['totals']==b['totals'] else 1)
          "; then
            echo "noop=true" >> "$GITHUB_OUTPUT"
            echo "snapshot identical to the published one — publishing nothing"
          else
            echo "noop=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish snapshot + maintain the run index (RFC §4.2/§4.6)
        id: publish
        env:
          BLIS_TAG: ${{ needs.detect-diff.outputs.blis_tag }}
          IX_TAG: ${{ needs.detect-diff.outputs.ix_tag }}
          NOOP: ${{ steps.changecheck.outputs.noop }}
        run: |
          snap_id=$(python3 -c "import json;print(json.load(open('incoming/summary.json'))['snapshot_id'])")
          # This job only runs when `evaluate` ran (i.e. detect-diff saw changed inputs, ~weekly when
          # a new dump lands) — on a genuinely unchanged night evaluate is skipped, so this job is too
          # and prior data/latest simply stands (RFC D3). When it DOES run: overwrite the published
          # numbers + advance state only if this snapshot differs from the published one (NOOP guard);
          # always write this run's snapshot dir and rebuild the index + prune >30d. So pruning
          # happens on evaluated nights, which bounds the dated-snapshot history fine given the
          # ~weekly cadence (it is NOT a nightly prune).
          if [ "$NOOP" != "true" ]; then
            mkdir -p data/latest
            cp incoming/summary.json data/latest/summary.json
            python3 -c "import json; json.dump({'blis_tag':'${BLIS_TAG}','ix_tag':'${IX_TAG}','snapshot_id':'${snap_id}'}, open('state/last-run.json','w'), indent=2)"
          fi
          mkdir -p "data/snapshots/${snap_id}"
          cp incoming/summary.json "data/snapshots/${snap_id}/summary.json"
          python3 orchestrator/update_index.py --data-dir data --retention-days 30 --today "$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data state/last-run.json
          # [skip ci] stops this commit from re-triggering workflows (incl. nightly's own loop) — but
          # it ALSO suppresses the Pages deploy that the new data needs. So we dispatch pages.yml
          # explicitly in the next step whenever a commit actually lands here.
          if git commit -m "nightly: ${snap_id} [skip ci]"; then
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "nothing to commit (no-op, index unchanged)"
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy the published data to Pages
        # Only when a commit actually landed. The nightly commit carries [skip ci], so the push-
        # triggered pages.yml never fires — this manual dispatch is what publishes the new run to
        # the live site.
        if: ${{ steps.publish.outputs.pushed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "${GITHUB_REF_NAME}"
